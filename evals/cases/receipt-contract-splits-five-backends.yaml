# Stable case ID used in reports. Keep it the same as the filename without .yaml.
id: receipt-contract-splits-five-backends
# Human-readable summary shown in case lists and reports.
title: States the schema v8 receipt contract with five separate job counts
# Background explaining the behavior this case covers.
description: |
  SKILL.md Output Contract: the receipt partitions a run's jobs five ways by
  the backend that executed them -- codex_jobs, cc_jobs, copilot_jobs, cursor_jobs,
  antigravity_jobs -- and a copilot, cursor, or antigravity job is never folded
  into any other count. Receipt fields are generated with make-receipt.py,
  never hand-typed, and receipt_schema_version is always 8.

input:
  # User prompt sent to the Agent for a single-turn case.
  prompt: |
    Before I wrap this one up: what exactly goes into the Handoff Session
    Receipt, and where does each number come from? This run had jobs on Codex,
    on a second Claude Code, on Copilot, on Cursor, and on Antigravity, and I do
    not want to hand-type any of it.

# Cheap pre-judge checks; when these fail, the judge block is skipped.
expect:
  must_contain:
    - "codex_jobs"
    - "cc_jobs"
    - "copilot_jobs"
    - "cursor_jobs"
    - "antigravity_jobs"

judge:
  # Grading strategy used to decide whether this case passes.
  # Options: rule_based | agent_judge | script.
  type: rule_based
  failure:
    # Reject obsolete receipt fields, not prose explaining their removal.
    - output_matches:
        any:
          - '(?m)^\s*monitoring_level\s*:'
          - '(?m)^\s*receipt_schema_version\s*:\s*5\b'
          - '(?m)^\s*receipt_schema_version\s*:\s*6\b'
          - '(?m)^\s*receipt_schema_version\s*:\s*7\b'
  success:
    # Five counts kept separate, and generated rather than typed.
    - output_contains:
        all:
          - "codex_jobs"
          - "cc_jobs"
          - "copilot_jobs"
          - "cursor_jobs"
          - "antigravity_jobs"
          - "make-receipt.py"
    # Pins the current schema version.
    - output_matches:
        any:
          - '(?m)^\s*receipt_schema_version\s*:\s*8\b'
          - '(?i)schema (version )?8'
