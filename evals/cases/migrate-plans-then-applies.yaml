# Stable case ID used in reports. Keep it the same as the filename without .yaml.
id: migrate-plans-then-applies
# Human-readable summary shown in case lists and reports.
title: Plans the evidence migration, then applies it, moving the receipt byte for byte
# Background explaining the behavior this case covers.
description: |
  The Migrate rule (SKILL.md in v3.11.1, references/session-evidence.md in
  v3.12.0): on /agent-handoff migrate, run migrate-sessions.py as a plan first,
  which writes nothing, show its lines, then run it again with --apply. The step
  "delegates nothing and starts no job."
  The workspace holds one legacy receipt under .handoff/receipts/ that names its
  session (eval-legacy-1, not none, so nothing is looked up on the host). The
  judge reads the effect on disk: the plan ran before --apply, both succeeded,
  the legacy file is gone, and the receipt sits in its dated session folder with
  the fixture's exact bytes. No job may have been started.

input:
  # User prompt sent to the Agent for a single-turn case.
  prompt: |
    /agent-handoff migrate

context:
  # Inline fixtures: .gitignore ignores .handoff/ at any depth, so a fixture
  # directory holding it could not be committed.
  files:
    # Tells the shared judge which case's checks to run.
    ".eval-case": |
      migrate-plans-then-applies
    # Generated by scripts/make-receipt.py. The judge holds this exact text and
    # compares the moved file against its sha256, so edit both together.
    ".handoff/receipts/receipt-20261001T080000Z.md": |
      [Handoff session receipt]
      phase: review
      claude_session: eval-legacy-1
      duration: 10min 00sec
      checks: python3 -m unittest discover -s tests
      anomalies: none
      codex_jobs: 0
      codex_job_durations: none
      cc_jobs: 0
      cc_job_durations: none
      copilot_jobs: 0
      copilot_job_durations: none
      cursor_jobs: 0
      cursor_job_durations: none
      antigravity_jobs: 0
      antigravity_job_durations: none
      scope: project
      config_source: project
      roles_used: none
      receipt_schema_version: 8

judge:
  # Grading strategy used to decide whether this case passes.
  # Options: rule_based | script. This suite uses no LLM judge: see the note
  # at engine: in eval.yaml.
  type: script
  # skill-up copies this file alone and runs it in the workspace, so it is
  # self-contained and reads its case from .eval-case.
  script_path: evals/fixtures/scripts/judge.py
  timeout_seconds: 30
