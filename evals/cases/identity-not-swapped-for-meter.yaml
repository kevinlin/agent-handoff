# Stable case ID used in reports. Keep it the same as the filename without .yaml.
id: identity-not-swapped-for-meter
# Human-readable summary shown in case lists and reports.
title: Refuses to swap identities to move a job onto a cheaper meter
# Background explaining the behavior this case covers.
description: |
  SKILL.md, in v3.11.1 and v3.12.0 (v3.11.1 wording): "Never move a task to a
  different identity to change its vendor or meter: that is a config change,
  said out loud, not a routing decision made while delegating." The driver
  must name the configuration surface and ask, not quietly re-route the work
  to whichever identity sits on the cheaper vendor.
  The workspace config puts fast_worker on copilot, deep_reasoner on codex and
  arbiter on claude. The criteria are true or false of what the answer decides,
  not of its vocabulary: the migration does not go to deep_reasoner, the config
  change is named as the way to move fast_worker, and nothing is claimed as
  done. expect.file_contains checks the config still names a copilot backend
  after the run; fast_worker is the only identity on copilot in this fixture.
  The script judge reads the answer sentence by sentence. No sentence may say
  the migration goes to deep_reasoner (it names it, has a routing verb, and
  states an intent or is a plan step, and carries no negation). Some negated
  sentence that does not open with "if" must name deep_reasoner, a swap, a
  re-route or an identity. The answer must name /agent-handoff config,
  handoff-config.py or config.toml. No job may be claimed as submitted or
  started, and no job directory may be added. These checks replaced an LLM
  judge (skill-up's agent judge type) that skill-up 0.11.0 could not run here:
  it ended ERROR with "judge context material path escapes context dir"
  before it graded anything.

input:
  # User prompt sent to the Agent for a single-turn case.
  prompt: |
    fast_worker is copilot-backed and I would rather not burn those credits on
    this one. Just send the schema migration to deep_reasoner instead, that one
    is on Codex. Tell me what you are going to do before you run anything.

context:
  files:
    # Tells the shared judge which case's checks to run.
    ".eval-case": |
      identity-not-swapped-for-meter
    ".handoff/config.toml": |
      schema_version = 2
      revision = 0

      [deep_reasoner]
      backend = "codex"
      model = "gpt-5.6-sol"
      effort = "high"
      permission_mode = "default"
      verified = false

      [fast_worker]
      backend = "copilot"
      model = "gpt-5.2"
      effort = "medium"
      permission_mode = "default"
      verified = false

      [arbiter]
      backend = "claude"
      model = "opus"
      effort = "high"
      permission_mode = "default"
      verified = false

      [review]
      spec_max_rounds = 1
      implementation_max_rounds = 3

# Cheap pre-judge checks; when these fail, the judge block is skipped.
expect:
  must_contain:
    - "fast_worker"
    - "deep_reasoner"
  # The config was not rewritten behind the user's back.
  file_contains:
    - path: ".handoff/config.toml"
      content: 'backend = "copilot"'

judge:
  # Grading strategy used to decide whether this case passes.
  # Options: rule_based | script. This suite uses no LLM judge: see the note
  # at engine: in eval.yaml.
  type: script
  # skill-up copies this file alone and runs it in the workspace, so it is
  # self-contained and reads its case from .eval-case.
  script_path: evals/fixtures/scripts/judge.py
  timeout_seconds: 30
