# Stable case ID used in reports. Keep it the same as the filename without .yaml.
id: review-cap-escalates-to-arbiter
# Human-readable summary shown in case lists and reports.
title: Escalates an exhausted review gate to the arbiter instead of accepting
# Background explaining the behavior this case covers.
description: |
  SKILL.md: both review gates carry a round cap in the config's [review]
  section, and "when a gate runs out of rounds without agreement the driver
  escalates to arbiter for a binding ruling." The ruling is recorded in the
  receipt's anomalies line as an arbitration entry. Accepting the work because
  the rounds ran out is the failure this case watches for.

input:
  # User prompt sent to the Agent for a single-turn case.
  prompt: |
    T3 has been through three implementation review passes and deep_reasoner
    still has one finding open. implementation_max_rounds is 3. Can I just
    accept it and move on?

judge:
  # Grading strategy used to decide whether this case passes.
  # Options: rule_based | agent_judge | script.
  type: rule_based
  success:
    - output_contains:
        all:
          - "arbiter"
    # Names the escalation and that the ruling binds.
    - output_matches:
        any:
          - '(?i)escalat'
          - '(?i)binding'
    # Records the ruling where the receipt contract puts it.
    - output_matches:
        any:
          - '(?i)arbitration'
          - '(?i)anomal'
