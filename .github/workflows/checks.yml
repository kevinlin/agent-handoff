name: checks

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish readiness smoke check
        run: bash scripts/check-skill-repo.sh .

      - name: Script syntax
        run: |
          bash -n install.sh
          bash -n scripts/check-skill-repo.sh
          bash -n scripts/delegate-codex.sh
          python3 -m py_compile scripts/english-only-scan.py scripts/showcase-cost-ledger.py scripts/validate-receipt.py scripts/validate-verdict.py scripts/run-test-prompts.py scripts/handoff_runtime.py scripts/handoff-setup.py scripts/handoff-setup-ui.py scripts/handoff-config.py scripts/goal-sync.py scripts/make-receipt.py scripts/render-cost-receipt.py scripts/render-transcript.py scripts/handoff-session-ui.py

      - name: Unit suite
        run: python3 -m unittest discover -s tests

      - name: Viewer tests
        run: node --test tests/test_transcript_viewer.mjs

      - name: Receipt contract
        run: |
          python3 scripts/run-test-prompts.py
          python3 scripts/make-receipt.py --start --repo .
          python3 scripts/make-receipt.py --repo . --phase review --claude-session ci-test \
            --checks "ci roundtrip" --codex-jobs 0 \
            --scope project --config-source project --roles-used '[]' \
            | python3 scripts/validate-receipt.py -

      - name: Ledger reproducibility
        run: |
          SOURCE_DATE_EPOCH=1782921600 python3 scripts/showcase-cost-ledger.py --markdown
          git diff --exit-code -- examples/showcase-cost-ledger.json

      - name: Install dry run
        run: bash install.sh --dry-run
