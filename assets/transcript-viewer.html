<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Handoff Transcript</title>
<script>
  // Resolved before first paint, so a stored choice never flashes the other
  // theme. Same 'handoff-theme' key and vocabulary as the setup wizard.
  (() => {
    let preference = 'system';
    try { preference = localStorage.getItem('handoff-theme') || 'system'; }
    catch (error) { preference = 'system'; }
    if (!['system', 'light', 'dark'].includes(preference)) preference = 'system';
    const dark = preference === 'dark' ||
      (preference === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    document.documentElement.dataset.themePreference = preference;
  })();
</script>
<style>
  /* light-dark() resolves against the used color-scheme, so the toggle only
     has to set color-scheme — one token set covers both themes. */
  :root {
    color-scheme: light dark;
    --bg:     light-dark(#fbfbfa, #16161a);
    --fg:     light-dark(#1a1a19, #e8e8e6);
    --muted:  light-dark(#6b6b68, #9a9a96);
    --line:   light-dark(#e3e3e0, #2c2c31);
    --card:   light-dark(#ffffff, #1e1e23);
    --accent: light-dark(#4a5cd6, #8b9aff);
    --ok:     light-dark(#2f7d4f, #5fbe84);
    --bad:    light-dark(#b3412e, #e2705a);
    --hover:  light-dark(#f1f1ef, #23232a);
    /* Segmented tray, matching the setup wizard's theme switch. */
    --switch-bg:    light-dark(#ececea, #23232a);
    --switch-hover: light-dark(#e3e3e0, #2c2c31);
    --switch-fg:    light-dark(#3d3d3a, #c3c3bf);
    --on-accent:    light-dark(#ffffff, #16161a);
    /* Soft accent tint for the prompt bubble, as in the setup wizard. */
    --accent-soft:     light-dark(#e7eaff, #232946);
    --accent-soft-line:light-dark(#c9d0f7, #38406b);
    --accent-soft-ink: light-dark(#41497f, #c3caf5);
    /* Status tints, kept tonal so the ok/bad ink stays above 4.5:1 on them. */
    --ok-soft:  light-dark(#e2f2e8, #1b2d22);
    /* Darker than --ok, which only clears 4.5:1 against --card, not the tint. */
    --ok-ink:   light-dark(#256240, #5fbe84);
    --ok-line:  light-dark(#bcdfc8, #2f5a3f);
    --bad-soft: light-dark(#fbe6e0, #32201c);
    --bad-line: light-dark(#f0c5b8, #5e3229);
    --shadow-card: 0 1px 2px rgb(0 0 0 / .04), 0 6px 18px rgb(0 0 0 / .05);
    --radius-card: 16px;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    --ease-out: cubic-bezier(.16, 1, .3, 1);
    --gutter: clamp(1rem, 3vw, 2.5rem);
  }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"]  { color-scheme: dark; }
  * { box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.6
    ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
  /* A wide window spends its width on the things that were being truncated:
     trace rows, shell output, message bubbles, and the header grid. */
  main { max-width:90rem; margin:0 auto; padding:1.5rem var(--gutter) 6rem; }

  #topbar { display:flex; justify-content:flex-end; margin-bottom:.5rem; }
  .segmented { display:flex; gap:2px; padding:3px; border:1px solid var(--line);
    border-radius:12px; background:var(--switch-bg); }
  .segmented button { position:relative; min-height:36px; padding:8px 12px;
    border:0; border-radius:9px; background:transparent; color:var(--switch-fg);
    font:12px var(--mono); cursor:pointer; }
  .segmented button::before { content:""; position:absolute; inset:-4px 0; }
  .segmented button[aria-pressed="true"] { background:var(--accent);
    color:var(--on-accent); }
  .segmented button:focus-visible { outline:2px solid var(--accent);
    outline-offset:2px; }

  #header { border:1px solid var(--line); border-radius:var(--radius-card);
    background:var(--card); padding:.9rem 1rem; margin-bottom:1.25rem;
    box-shadow:var(--shadow-card); }
  #header dl { display:grid; grid-template-columns:auto minmax(0,1fr);
    gap:.15rem .75rem; margin:0; font-size:.85rem; }
  /* Field labels share the bubble role-label treatment, so a label never
     competes with the value beside it. */
  #header dt { color:var(--muted); font:11px/1.6 var(--mono);
    text-transform:uppercase; letter-spacing:.06em; }
  #header dd { margin:0; padding-inline-end:1.5rem; overflow-wrap:anywhere;
    font-variant-numeric:tabular-nums; }
  /* Values are styled by nature: machine strings in mono, clock values in the
     body face, unknowns in muted italic, and flags as pills. */
  #header dd.mono { font-family:var(--mono); font-size:.8rem; }
  #header dd.absent { color:var(--muted); font-style:italic; }
  .pill { display:inline-flex; align-items:center; padding:.05rem .5rem;
    border:1px solid var(--line); border-radius:999px; background:var(--bg);
    font:11px var(--mono); text-transform:uppercase; letter-spacing:.06em; }
  /* The state word is inside the pill, so colour is reinforcement, never the
     only carrier. */
  .pill.ok   { color:var(--ok-ink); background:var(--ok-soft); border-color:var(--ok-line); }
  .pill.bad  { color:var(--bad); background:var(--bad-soft); border-color:var(--bad-line); }
  .pill.live { color:var(--accent-soft-ink); background:var(--accent-soft);
    border-color:var(--accent-soft-line); }
  .pill.off  { color:var(--muted); }
  /* Twelve stacked pairs is a tall ribbon on a wide screen. Pairs flow
     left-to-right, so the same grid just gains columns. */
  @media (min-width:62rem) {
    #header dl { grid-template-columns:repeat(2, auto minmax(0,1fr)); }
  }
  @media (min-width:92rem) {
    #header dl { grid-template-columns:repeat(3, auto minmax(0,1fr)); }
  }

  #controls { display:flex; flex-wrap:wrap; gap:.5rem 1rem; align-items:center;
    margin-bottom:.75rem; font-size:.85rem; }
  /* display:flex above outranks the UA [hidden] rule, which would otherwise
     leave a stray checkbox on the empty drop page. */
  #controls[hidden] { display:none; }
  #controls label { display:inline-flex; align-items:center; gap:.45rem;
    cursor:pointer; padding:.45rem .5rem; margin-inline:-.5rem;
    border-radius:.35rem; user-select:none; }

  .row { border-bottom:1px solid var(--line); }
  .row summary { cursor:pointer; display:flex; gap:.6rem; align-items:baseline;
    font-family:var(--mono); font-size:.82rem;
    padding:.4rem .5rem; margin-inline:-.5rem; border-radius:.35rem; }
  @media (hover:hover) and (pointer:fine) {
    .row summary:hover { background:var(--hover); }
    .segmented button:hover { background:var(--switch-hover); color:var(--fg); }
    .segmented button[aria-pressed="true"]:hover { background:var(--accent);
      color:var(--on-accent); }
  }
  .row summary:focus-visible { outline:2px solid var(--accent);
    outline-offset:1px; }
  .row .glyph { flex:none; width:1.4rem; text-align:center; color:var(--muted); }
  .row .glyph.ok { color:var(--ok); }
  .row .glyph.bad { color:var(--bad); }
  .row .label { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap; }
  .row .size { flex:none; color:var(--muted); font-size:.78rem;
    font-variant-numeric:tabular-nums; }
  /* A 100 KB shell output would otherwise bury the rest of the transcript
     the moment its row is opened. */
  .row pre { overflow:auto; max-height:min(60vh, 40rem); background:var(--card);
    border:1px solid var(--line); border-radius:.4rem; padding:.6rem .75rem;
    font-size:.8rem; margin:.5rem 0; }

  /* Agent prose quotes absolute paths, which have no break opportunity and
     would otherwise push the page wider than a narrow window. */
  .agent { position:relative; margin:.75rem 0; padding:1rem 1.15rem;
    border:1px solid var(--line); border-radius:var(--radius-card);
    background:var(--card); box-shadow:var(--shadow-card);
    overflow-wrap:break-word; }
  /* The prompt bubble is the job's own input: tinted and labelled, so it does
     not read as something the worker said. */
  .agent.user { background:var(--accent-soft);
    border-color:var(--accent-soft-line); }
  .agent.user .msg-role { color:var(--accent-soft-ink); }
  .msg-role { display:block; margin-bottom:.35rem; color:var(--muted);
    font:11px/1.4 var(--mono); text-transform:uppercase;
    letter-spacing:.06em; }
  /* Prose fills the bubble instead of wrapping at a narrower measure. */
  .agent > * { text-wrap:pretty; }
  .agent > :first-child { margin-top:0; }
  .agent > :last-child { margin-bottom:0; }
  .agent > :is(h1,h2,h3,h4) { font-size:1.05rem; margin:1rem 0 .4rem;
    text-wrap:balance; }
  .agent > pre { max-width:none; overflow-x:auto; background:var(--bg);
    border:1px solid var(--line); border-radius:8px; padding:.6rem .75rem; }
  .agent code { font-size:.85em; }
  /* Translucent, so a code chip sits correctly on the plain and the tinted
     bubble alike. */
  .agent :not(pre) > code { background:light-dark(rgb(0 0 0 / .05),
    rgb(255 255 255 / .08)); border:1px solid var(--line);
    border-radius:.25rem; padding:.05em .3em; }
  .agent > table { max-width:100%; width:max-content; display:block;
    overflow-x:auto; border-collapse:collapse; font-size:.9em; margin:.75rem 0; }
  .agent :is(th,td) { border:1px solid var(--line); padding:.3rem .6rem;
    text-align:left; vertical-align:top; }
  .agent > blockquote { margin:.75rem 0; padding-left:.9rem;
    border-left:3px solid var(--line); color:var(--muted); }

  .muted { color:var(--muted); font-style:italic; }
  .bad { color:var(--bad); }
  .ok { color:var(--ok); }
  #dropzone { border:2px dashed var(--line); border-radius:.6rem;
    padding:3rem 1rem; margin-top:1.5rem; text-align:center; color:var(--muted); }
  #dropzone.over { border-color:var(--accent); color:var(--fg); }

  @media (prefers-reduced-motion:no-preference) {
    .row summary, .segmented button, #dropzone {
      transition:background-color .16s ease, border-color .16s ease,
                 color .16s ease, transform .1s var(--ease-out); }
    .segmented button:active { transform:scale(.98); }
  }
</style>
</head>
<body>
<main>
  <div id="topbar">
    <div class="segmented" id="themeSwitch" role="group" aria-label="Theme">
      <button type="button" data-theme-choice="system">System</button>
      <button type="button" data-theme-choice="light">Light</button>
      <button type="button" data-theme-choice="dark">Dark</button>
    </div>
  </div>
  <div id="header" hidden></div>
  <div id="controls" hidden>
    <label><input type="checkbox" id="only-agent"> Conversation only</label>
    <span id="counts" class="muted"></span>
  </div>
  <div id="stream"></div>
  <div id="dropzone">Drop a <code>log.jsonl</code> here to read it.</div>
</main>

<script id="handoff-payload" type="application/json">null</script>

<script id="viewer-normalize">
(function () {
  const HV = (window.HandoffViewer = window.HandoffViewer || {});

  const SHELL_TOOLS = new Set(['Bash', 'BashOutput', 'Shell']);
  const EDIT_TOOLS = new Set(['Edit', 'Write', 'NotebookEdit', 'MultiEdit']);

  function mapCodexItem(item) {
    const t = item.type;
    if (t === 'agent_message') return { kind: 'agent', text: item.text || '' };
    if (t === 'reasoning') return { kind: 'reasoning', text: item.text || '' };
    if (t === 'command_execution') return {
      kind: 'command', command: item.command || '',
      output: item.aggregated_output || '', exit_code: item.exit_code,
      status: item.status };
    if (t === 'file_change') return {
      kind: 'file_change', changes: item.changes || [], status: item.status };
    if (t === 'mcp_tool_call') return {
      kind: 'mcp', server: item.server, tool: item.tool, args: item.arguments,
      result: item.result, error: item.error, status: item.status };
    if (t === 'web_search') return {
      kind: 'web_search',
      queries: (item.action && item.action.queries) ||
               (item.query ? [item.query] : []) };
    if (t === 'error') return { kind: 'error', text: item.message || '' };
    return { kind: 'unknown', type: t };
  }

  function mapClaudeBlock(block) {
    if (block.type === 'text') return { kind: 'agent', text: block.text || '' };
    if (block.type === 'thinking')
      return { kind: 'reasoning', text: block.thinking || block.text || '' };
    if (block.type === 'tool_use') {
      const name = block.name || '';
      const input = block.input || {};
      const base = { tool_use_id: block.id, tool: name, args: input };
      if (SHELL_TOOLS.has(name))
        return { ...base, kind: 'command', command: input.command || '', output: '' };
      if (name.startsWith('mcp__'))
        return { ...base, kind: 'mcp', server: name.split('__')[1] || '' };
      if (EDIT_TOOLS.has(name))
        // Provisional: demoted to `error` by its result when the edit failed.
        return { ...base, kind: 'file_change', pending_edit: true,
                 changes: input.file_path ? [{ path: input.file_path, kind: 'update' }] : [] };
      return { ...base, kind: 'tool' };
    }
    return { kind: 'unknown', type: block.type };
  }

  const COPILOT_EDIT_TOOLS = new Set(['create', 'edit', 'str_replace', 'write']);

  function mapCopilotTool(data) {
    const name = data.toolName || '';
    const args = data.arguments || {};
    const base = { tool_call_id: data.toolCallId, tool: name, args };
    if (name === 'bash' || name === 'shell')
      return { ...base, kind: 'command', command: args.command || '', output: '' };
    if (COPILOT_EDIT_TOOLS.has(name))
      // Provisional, as in the claude branch: a refused write is not a change.
      return { ...base, kind: 'file_change', pending_edit: true,
               changes: args.path ? [{ path: args.path, kind: 'update' }] : [] };
    return { ...base, kind: 'tool' };
  }

  // Copilot's terminal event is `type: "result"`, the same type name claude
  // stream-json uses with a different payload, so the branch is chosen by the
  // declared backend and never by the event shape. Only types unique to one
  // format may seed the guess a metadata-free dropped log needs.
  HV.inferBackend = function inferBackend(logText) {
    const lines = String(logText == null ? '' : logText).split('\n');
    for (const line of lines) {
      if (!line.trim()) continue;
      let event;
      try { event = JSON.parse(line.trim()); } catch (_) { continue; }
      const type = (event && event.type) || '';
      if (type === 'assistant.turn_start' || type === 'tool.execution_start')
        return 'copilot';
      if (type.indexOf('item.') === 0) return 'codex';
    }
    return null;
  };

  HV.normalize = function normalize(logText, backend) {
    const rows = [];
    const byItemId = new Map();
    const byToolUseId = new Map();
    const byToolCallId = new Map();
    const lines = String(logText == null ? '' : logText).split('\n');
    const format = backend || HV.inferBackend(logText);
    let partial = false;

    // Codex emits no per-event clock; Claude stream-json carries `timestamp`
    // on most events. Stamp rows where the format supplies one, per the spec.
    let currentTime = null;
    const add = (row) => {
      if (currentTime && row.time == null) row.time = currentTime;
      rows.push(row);
      return row;
    };

    lines.forEach((line, index) => {
      const raw = line.trim();
      if (!raw) return;

      let event;
      try {
        event = JSON.parse(raw);
      } catch (_) {
        // Only the last non-empty line may be a partial write from a live job.
        const restEmpty = lines.slice(index + 1).every(l => !l.trim());
        if (restEmpty) partial = true;
        else add({ kind: 'unparsed', pos: index, line: index + 1, text: raw });
        return;
      }

      const type = event.type || '';
      const item = event.item || null;
      currentTime = typeof event.timestamp === 'string' ? event.timestamp : null;

      // --- Copilot envelope -----------------------------------------------
      if (format === 'copilot') {
        // Streaming noise: one small job produced 82 ephemeral message deltas.
        if (event.ephemeral === true) return;
        const data = event.data || {};

        if (type === 'tool.execution_start') {
          const row = add({ pos: index, raw: data, ...mapCopilotTool(data) });
          if (data.toolCallId) byToolCallId.set(data.toolCallId, row);
          return;
        }
        if (type === 'tool.execution_complete') {
          const target = byToolCallId.get(data.toolCallId);
          const error = data.error || null;
          const text = error
            ? (error.message || 'tool call failed')
            : ((data.result && data.result.content) || '');
          if (!target) {
            add({ kind: 'error', pos: index, raw: data,
                  text: 'tool result with no matching tool call' });
            return;
          }
          target.output = text;
          target.is_error = data.success === false;
          // The denial is typed, so it never has to be pattern-matched.
          if (error && error.code === 'denied') target.denied = true;
          if (target.pending_edit && target.is_error) {
            target.kind = 'error';
            target.text = text;
          }
          delete target.pending_edit;
          return;
        }
        // A tool-calling assistant.message carries no text; its work shows up
        // as the tool.execution_* pair already folded above.
        if (type === 'assistant.message') {
          if (data.phase === 'final_answer')
            add({ kind: 'agent', pos: index, text: data.content || '',
                  final: true, raw: data });
          return;
        }
        if (type === 'session.error')
          return add({ kind: 'error', pos: index, raw: data,
                       text: data.message || 'session error' });
        if (type === 'assistant.turn_start')
          return add({ kind: 'lifecycle', pos: index, label: 'turn started',
                       raw: event });
        if (type === 'assistant.turn_end')
          return add({ kind: 'lifecycle', pos: index, label: 'turn completed',
                       raw: event });
        if (type === 'result')
          return add({ kind: 'lifecycle', pos: index, label: 'result',
                       detail: `exit ${event.exitCode}`, usage: event.usage,
                       raw: event });
        add({ kind: 'unknown', pos: index, type, raw: event });
        return;
      }

      // --- Codex envelope -------------------------------------------------
      if (item && type.indexOf('item.') === 0) {
        const mapped = mapCodexItem(item);
        if (item.id && byItemId.has(item.id)) {
          const existing = byItemId.get(item.id);
          Object.assign(existing, mapped, { pos: existing.pos, raw: item });
          return;
        }
        const row = add({ pos: index, id: item.id, raw: item, ...mapped });
        if (item.id) byItemId.set(item.id, row);
        return;
      }

      // --- Claude stream-json ---------------------------------------------
      if (type === 'assistant' || type === 'user') {
        const blocks = (event.message && event.message.content) || [];
        const list = Array.isArray(blocks)
          ? blocks : [{ type: 'text', text: String(blocks) }];
        list.forEach((block) => {
          if (block && block.type === 'tool_result') {
            const target = byToolUseId.get(block.tool_use_id);
            const text = typeof block.content === 'string'
              ? block.content
              : JSON.stringify(block.content);
            if (!target) {
              add({ kind: 'error', pos: index, raw: block,
                    text: 'tool_result with no matching tool_use' });
              return;
            }
            target.output = text;
            target.is_error = Boolean(block.is_error);
            // A failed edit is not a file change.
            if (target.pending_edit && target.is_error) {
              target.kind = 'error';
              target.text = text;
            }
            delete target.pending_edit;
            return;
          }
          const mapped = mapClaudeBlock(block || {});
          const row = add({
            pos: index, raw: block, parent_tool_use_id: event.parent_tool_use_id,
            ...mapped });
          if (row.tool_use_id) byToolUseId.set(row.tool_use_id, row);
        });
        return;
      }

      if (type === 'result') {
        const finalText = event.result || '';
        const lastAgent = [...rows].reverse().find(r => r.kind === 'agent');
        if (finalText && lastAgent && lastAgent.text.trim() === finalText.trim()) {
          lastAgent.final = true;               // render once, marked as final
        } else if (finalText) {
          add({ kind: 'agent', pos: index, text: finalText, final: true, raw: event });
        }
        add({ kind: 'lifecycle', pos: index, label: 'result',
              usage: event.usage, raw: event });
        (event.errors || []).forEach(e =>
          add({ kind: 'error', pos: index, text: String(e), raw: event }));
        return;
      }

      if (type === 'system') {
        add({ kind: 'lifecycle', pos: index, label: 'session start',
              detail: event.session_id, raw: event });
        return;
      }

      // --- Lifecycle and loose errors, never correlated --------------------
      if (type === 'thread.started')
        return add({ kind: 'lifecycle', pos: index, label: 'thread started',
                     detail: event.thread_id, raw: event });
      if (type === 'turn.started')
        return add({ kind: 'lifecycle', pos: index, label: 'turn started', raw: event });
      if (type === 'turn.completed')
        return add({ kind: 'lifecycle', pos: index, label: 'turn completed',
                     usage: event.usage, raw: event });
      if (type === 'turn.failed')
        return add({ kind: 'error', pos: index, text: 'turn failed', raw: event });
      if (type === 'error')
        return add({ kind: 'error', pos: index,
                     text: event.message || event.error || 'error', raw: event });

      add({ kind: 'unknown', pos: index, type, raw: event });
    });

    rows.sort((a, b) => a.pos - b.pos);
    return { rows, partial };
  };
})();
</script>

<script id="viewer-render">
(function () {
  const HV = (window.HandoffViewer = window.HandoffViewer || {});
  const ENTITIES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };

  HV.escapeHtml = function escapeHtml(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, c => ENTITIES[c]);
  };

  const SAFE_SCHEME = /^(https?:|mailto:|#)/i;
  HV.safeHref = function safeHref(url) {
    const trimmed = String(url == null ? '' : url).trim();
    return SAFE_SCHEME.test(trimmed) ? trimmed : null;
  };

  // marked does not sanitize; it passes raw HTML through by design. Replacing
  // a renderer also replaces marked's own escaping, so each override escapes
  // what it emits. link() receives *tokens*, not rendered text — without
  // parseInline the link's contents are silently dropped.
  const renderer = new marked.Renderer();

  renderer.html = ({ text }) => HV.escapeHtml(text);

  renderer.link = function ({ href, title, tokens }) {
    const inner = this.parser.parseInline(tokens);
    const safe = HV.safeHref(href);
    if (!safe) return `${inner} [${HV.escapeHtml(href)}]`;
    const titleAttr = title ? ` title="${HV.escapeHtml(title)}"` : '';
    return `<a href="${HV.escapeHtml(safe)}"${titleAttr} rel="noreferrer noopener">${inner}</a>`;
  };

  renderer.image = function ({ href, title, text }) {
    const safe = HV.safeHref(href);
    if (!safe) return `${HV.escapeHtml(text || '')} [${HV.escapeHtml(href)}]`;
    const titleAttr = title ? ` title="${HV.escapeHtml(title)}"` : '';
    return `<img src="${HV.escapeHtml(safe)}" alt="${HV.escapeHtml(text || '')}"${titleAttr}>`;
  };

  marked.use({ renderer });

  HV.renderMarkdown = function renderMarkdown(text) {
    return marked.parse(String(text == null ? '' : text));
  };

  const $ = (id) => document.getElementById(id);

  function localTime(iso) {
    if (!iso) return null;
    const d = new Date(iso);
    return isNaN(d) ? null : d.toLocaleString();
  }

  // The phrases the header prints when the job's own files do not record a
  // field. Styled as unknowns rather than as values.
  const ABSENT = new Set(['not recorded', 'inherited from parent',
                          'no timestamps in this log']);
  const STATE_TONE = { DONE: 'ok', FAILED: 'bad', RUNNING: 'live',
                       CANCELLED: 'off' };

  function definition(list, term, value, kind) {
    if (value == null || value === '') return;
    const dt = document.createElement('dt');
    dt.textContent = term;                    // untrusted: textContent only
    const dd = document.createElement('dd');
    if (value instanceof Node) {
      dd.append(value);
    } else {
      dd.className = ABSENT.has(value) ? 'absent' : (kind || '');
      dd.textContent = value;
    }
    list.append(dt, dd);
  }

  function pill(text, tone) {
    const span = document.createElement('span');
    span.className = 'pill ' + (tone || 'off');
    span.textContent = text;                  // untrusted: textContent only
    return span;
  }

  function renderHeader(payload) {
    const box = $('header');
    box.textContent = '';
    const meta = payload.meta || {};
    const list = document.createElement('dl');

    definition(list, 'job', payload.job_id, 'mono');
    definition(list, 'label', meta.label, 'mono');
    // A resumed job records neither backend nor role, and model=inherit.
    definition(list, 'role', meta.role || (payload.parent_job_id ? 'not recorded' : null), 'mono');
    definition(list, 'backend', meta.backend || (payload.parent_job_id ? 'not recorded' : null), 'mono');
    definition(list, 'model',
      meta.model === 'inherit' ? 'inherited from parent' : meta.model, 'mono');
    definition(list, 'effort', meta.effort, 'mono');
    definition(list, 'read only', meta.read_only && pill(meta.read_only, 'off'));
    definition(list, 'parent', payload.parent_job_id, 'mono');
    definition(list, 'state',
      payload.state && pill(payload.state, STATE_TONE[payload.state]));

    const started = localTime(meta.submitted_at);
    const ended = localTime(payload.exit_code_mtime);
    // No exit_code does not mean running: a cancelled job and a worker that
    // died without writing one both land here. Say which, rather than print
    // "still running" beside a CANCELLED state field.
    const openEnd = payload.state === 'RUNNING' ? 'still running'
      : payload.state === 'CANCELLED' ? 'cancelled before exit'
      : payload.state === 'FAILED' ? 'ended without an exit code'
      : 'end not recorded';
    if (started) definition(list, 'window', ended ? `${started} → ${ended}`
                                                  : `${started} → ${openEnd}`);
    definition(list, 'last log write', localTime(payload.log_mtime));
    definition(list, 'page generated', localTime(payload.generated_at));
    if (!started && !ended)
      definition(list, 'timing', 'no timestamps in this log');

    box.append(list);
    box.hidden = false;
  }

  function summarize(row) {
    // A denial is the failure the exit code does not show, so it is named in
    // the summary rather than left folded inside the body.
    if (row.denied) return `denied: ${row.tool || 'tool'} ${row.command || ''}`.trim();
    if (row.kind === 'command') return row.command;
    if (row.kind === 'file_change')
      return (row.changes || []).map(c => `${c.kind} ${c.path}`).join(', ');
    if (row.kind === 'mcp') return `${row.server || '?'}.${row.tool || '?'}`;
    if (row.kind === 'tool') return row.tool || 'tool';
    if (row.kind === 'web_search') return (row.queries || []).join(' | ');
    if (row.kind === 'lifecycle') return row.label + (row.detail ? ` ${row.detail}` : '');
    if (row.kind === 'unparsed') return `unparsed line ${row.line}`;
    if (row.kind === 'error') return row.text || 'error';
    return row.type || row.kind;
  }

  function glyphFor(row) {
    if (row.kind === 'error' || row.is_error) return '!';
    if (row.kind === 'unparsed') return '?';
    if (row.kind === 'command') {
      // Copilot reports a tool outcome as a boolean, never as an exit code,
      // so a finished successful call would otherwise read as still running.
      if (row.exit_code == null && row.is_error === false) return 'ok';
      return row.exit_code === 0 ? 'ok' : (row.exit_code == null ? '..' : 'x');
    }
    if (row.kind === 'file_change') return 'w';
    return '-';
  }

  function bytes(n) {
    if (!n) return '';
    return n < 1024 ? `${n} B` : `${(n / 1024).toFixed(1)} KB`;
  }

  function renderRow(row) {
    if (row.kind === 'agent' || row.kind === 'reasoning' || row.kind === 'user') {
      const article = document.createElement('article');
      article.className = 'agent';
      // The ONLY markup assignment in the viewer, and only on renderMarkdown
      // output, whose emitted tags are allowlisted by the renderer overrides
      // above. Every other log string reaches the DOM through textContent.
      article.innerHTML = HV.renderMarkdown(row.text || '');
      const role = document.createElement('span');
      role.className = 'msg-role';
      role.textContent = row.kind === 'user' ? 'prompt' : row.kind;
      article.prepend(role);
      if (row.kind === 'user') article.classList.add('user');
      if (row.time) {
        const when = document.createElement('div');
        when.className = 'muted';
        when.textContent = localTime(row.time) || '';
        role.after(when);
      }
      if (row.kind === 'reasoning') article.classList.add('muted');
      return article;
    }
    const details = document.createElement('details');
    details.className = 'row';
    const summary = document.createElement('summary');

    const glyph = document.createElement('span');
    glyph.className = 'glyph ' + (glyphFor(row) === 'ok' ? 'ok'
                                : glyphFor(row) === 'x' ? 'bad' : '');
    glyph.textContent = glyphFor(row);

    const label = document.createElement('span');
    label.className = 'label';
    label.textContent = summarize(row);      // untrusted: textContent

    const size = document.createElement('span');
    size.className = 'size';
    size.textContent = bytes((row.output || '').length);

    if (row.time) {
      const when = document.createElement('span');
      when.className = 'size';
      when.textContent = localTime(row.time) || '';
      summary.append(glyph, label, when, size);
    } else {
      summary.append(glyph, label, size);
    }
    details.append(summary);

    const body = document.createElement('pre');
    // Full source object, so a field the mapping table does not name stays
    // reachable rather than being silently lost.
    body.textContent = (row.output ? row.output + '\n\n' : '') +
      (row.text && row.kind !== 'error' ? row.text + '\n\n' : '') +
      JSON.stringify(row.raw, null, 1);
    details.append(body);
    return details;
  }

  HV.mount = function mount(payload) {
    // A generated page declares its backend; a dropped raw log has no meta,
    // so normalize falls back to inferring it from the events.
    const { rows, partial } = HV.normalize(payload.log_text || '',
                                           (payload.meta || {}).backend);
    renderHeader(payload);

    const stream = $('stream');
    stream.textContent = '';
    // prompt.md is the job's first user message; the log starts after it.
    if (payload.prompt_text)
      stream.append(renderRow({ kind: 'user', text: payload.prompt_text }));
    rows.forEach(row => stream.append(renderRow(row)));

    if (partial) {
      const note = document.createElement('p');
      note.className = 'muted';
      note.textContent = 'log continues — the last line was still being written';
      stream.append(note);
    }

    const counts = rows.reduce((acc, r) => (acc[r.kind] = (acc[r.kind] || 0) + 1, acc), {});
    $('counts').textContent = Object.entries(counts)
      .map(([k, v]) => `${v} ${k}`).join(' · ');
    $('controls').hidden = false;
    $('dropzone').textContent = 'Drop another log.jsonl to replace this transcript.';

    const toggle = $('only-agent');
    toggle.onchange = () => {
      stream.querySelectorAll('.row').forEach(el => { el.hidden = toggle.checked; });
    };
  };
})();
</script>

<script id="viewer-boot">
(function () {
  const slot = document.getElementById('handoff-payload');
  let payload = null;
  try { payload = JSON.parse(slot.textContent); } catch (_) { payload = null; }
  if (payload) window.HandoffViewer.mount(payload);

  const root = document.documentElement;
  const systemDark = window.matchMedia('(prefers-color-scheme: dark)');
  let themePreference = root.dataset.themePreference || 'system';

  function applyTheme(preference) {
    themePreference = preference;
    const dark = preference === 'dark' ||
      (preference === 'system' && systemDark.matches);
    root.dataset.theme = dark ? 'dark' : 'light';
    root.dataset.themePreference = preference;
    document.querySelectorAll('#themeSwitch button').forEach(el =>
      el.setAttribute('aria-pressed', String(el.dataset.themeChoice === preference)));
  }
  document.querySelectorAll('#themeSwitch button').forEach(el =>
    el.addEventListener('click', () => {
      applyTheme(el.dataset.themeChoice);
      try { localStorage.setItem('handoff-theme', el.dataset.themeChoice); }
      catch (error) { /* private window: this session only */ }
    }));
  systemDark.addEventListener('change', () => {
    if (themePreference === 'system') applyTheme('system');
  });
  applyTheme(themePreference);

  const zone = document.getElementById('dropzone');
  const stop = (e) => { e.preventDefault(); e.stopPropagation(); };
  ['dragenter', 'dragover'].forEach(n => document.addEventListener(n, (e) => {
    stop(e); zone.classList.add('over');
  }));
  ['dragleave', 'drop'].forEach(n => document.addEventListener(n, (e) => {
    stop(e); zone.classList.remove('over');
  }));
  document.addEventListener('drop', async (e) => {
    const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (!file) return;
    // A dropped log carries no meta, so mount with an empty job record rather
    // than merging into whatever job the page was generated for.
    window.HandoffViewer.mount({
      job_id: file.name, meta: {}, log_text: await file.text(), prompt_text: '',
      state: null, exit_code: null, exit_code_mtime: null,
      log_mtime: null, generated_at: null, parent_job_id: null
    });
  });
})();
</script>
</body>
</html>
