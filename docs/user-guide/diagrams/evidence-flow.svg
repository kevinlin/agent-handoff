<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 590">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0f172a; }
    .m { font-family: "SF Mono", Menlo, Consolas, ui-monospace, monospace; }
    .title { font-size: 22px; font-weight: 700; }
    .sub { font-size: 14px; fill: #64748b; }
    .name { font-size: 15px; font-weight: 700; }
    .line { font-size: 13px; fill: #475569; }
    .small { font-size: 12px; fill: #64748b; }
    .head { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e6ebf2" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
  </defs>

  <rect width="1240" height="590" fill="#f8fafc"/>
  <rect width="1240" height="590" fill="url(#grid)"/>

  <text x="40" y="44" class="title">Evidence: written while the run happens, read after it</text>
  <text x="40" y="68" class="sub">Nothing is collected at the end that the run did not already write down.</text>

  <!-- during -->
  <text x="40" y="112" class="head" fill="#475569">WHILE THE RUN IS GOING</text>

  <rect x="40" y="126" width="360" height="52" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="60" y="148" class="line m">session-start</text>
  <text x="60" y="168" class="small">stamped before the first job — the clock</text>

  <rect x="40" y="192" width="360" height="96" rx="9" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="60" y="218" class="name m" fill="#b45309">goal.md</text>
  <text x="60" y="242" class="line">every task status as it changed</text>
  <text x="60" y="264" class="small">the review rounds, the rulings, the notes</text>

  <rect x="40" y="302" width="360" height="176" rx="9" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="60" y="330" class="name m">jobs/&lt;jobId&gt;/</text>
  <text x="60" y="352" class="small">one directory per job, fix rounds included</text>
  <rect x="60" y="366" width="152" height="30" rx="6" fill="#f1f5f9"/>
  <text x="74" y="386" class="small m">prompt.md</text>
  <rect x="222" y="366" width="152" height="30" rx="6" fill="#f1f5f9"/>
  <text x="236" y="386" class="small m">run.sh</text>
  <rect x="60" y="402" width="152" height="30" rx="6" fill="#f1f5f9"/>
  <text x="74" y="422" class="small m">meta</text>
  <rect x="222" y="402" width="152" height="30" rx="6" fill="#f1f5f9"/>
  <text x="236" y="422" class="small m">log.jsonl</text>
  <rect x="60" y="438" width="152" height="30" rx="6" fill="#f1f5f9"/>
  <text x="74" y="458" class="small m">stderr.log</text>
  <rect x="222" y="438" width="152" height="30" rx="6" fill="#f1f5f9"/>
  <text x="236" y="458" class="small m">exit_code</text>

  <!-- arrows into wrap up -->
  <path d="M 400 152 C 430 152, 430 230, 456 230" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 400 240 C 430 240, 430 232, 456 232" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 400 390 C 430 390, 430 236, 456 236" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- wrap up -->
  <text x="460" y="112" class="head" fill="#475569">AT WRAP UP</text>

  <rect x="460" y="196" width="340" height="76" rx="9" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="630" y="226" class="name" text-anchor="middle">the receipt is generated</text>
  <text x="630" y="250" class="small" text-anchor="middle">measured from those files, never recalled</text>

  <line x1="630" y1="272" x2="630" y2="300" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="460" y="304" width="340" height="130" rx="9" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="630" y="334" class="name" text-anchor="middle">Handoff session receipt</text>
  <text x="482" y="362" class="small m">duration</text>
  <text x="482" y="384" class="small m">codex_jobs · cc_jobs · copilot_jobs</text>
  <text x="482" y="406" class="small m">checks · anomalies · roles_used</text>
  <text x="482" y="426" class="small">one line per fact, and each has a source</text>

  <line x1="630" y1="434" x2="630" y2="462" stroke="#059669" stroke-width="1.6" marker-end="url(#arrow-green)"/>
  <rect x="460" y="466" width="340" height="52" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
  <text x="630" y="490" class="line" text-anchor="middle">checked again after it is written</text>
  <text x="630" y="510" class="small" text-anchor="middle">the same check the project's CI runs</text>

  <!-- readers -->
  <text x="860" y="112" class="head" fill="#475569">WHAT YOU CAN OPEN AFTERWARDS</text>

  <line x1="800" y1="370" x2="856" y2="370" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="860" y="126" width="340" height="76" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="884" y="156" class="name">the job transcript</text>
  <text x="884" y="180" class="small">one job, step by step, as a page you can read</text>

  <rect x="860" y="212" width="340" height="76" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="884" y="242" class="name">the cost receipt</text>
  <text x="884" y="266" class="small">what each meter recorded, in its own units</text>

  <rect x="860" y="298" width="340" height="76" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="884" y="328" class="name">the session page</text>
  <text x="884" y="352" class="small">the whole run on one page, with the timeline</text>

  <rect x="860" y="384" width="340" height="76" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="884" y="414" class="name m">/agent-handoff resume</text>
  <text x="884" y="438" class="small">the next session reads this, not the repo</text>

  <!-- rules -->
  <rect x="860" y="478" width="340" height="76" rx="9" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="884" y="504" class="small">generated, never typed by hand</text>
  <text x="884" y="524" class="small">measured, never repriced at another vendor's rates</text>
  <text x="884" y="544" class="small">a gap is named — never quietly written as zero</text>
</svg>
