    <symbol id="ic-copilot" viewBox="0 0 24 24"><path fill-rule="evenodd" fill="#0f172a" d="M23.922 16.997C23.061 18.492 18.063 22.02 12 22.02 5.937 22.02.939 18.492.078 16.997A.641.641 0 0 1 0 16.741v-2.869a.883.883 0 0 1 .053-.22c.372-.935 1.347-2.292 2.605-2.656.167-.429.414-1.055.644-1.517a10.098 10.098 0 0 1-.052-1.086c0-1.331.282-2.499 1.132-3.368.397-.406.89-.717 1.474-.952C7.255 2.937 9.248 1.98 11.978 1.98c2.731 0 4.767.957 6.166 2.093.584.235 1.077.546 1.474.952.85.869 1.132 2.037 1.132 3.368 0 .368-.014.733-.052 1.086.23.462.477 1.088.644 1.517 1.258.364 2.233 1.721 2.605 2.656a.841.841 0 0 1 .053.22v2.869a.641.641 0 0 1-.078.256Zm-11.75-5.992h-.344a4.359 4.359 0 0 1-.355.508c-.77.947-1.918 1.492-3.508 1.492-1.725 0-2.989-.359-3.782-1.259a2.137 2.137 0 0 1-.085-.104L4 11.746v6.585c1.435.779 4.514 2.179 8 2.179 3.486 0 6.565-1.4 8-2.179v-6.585l-.098-.104s-.033.045-.085.104c-.793.9-2.057 1.259-3.782 1.259-1.59 0-2.738-.545-3.508-1.492a4.359 4.359 0 0 1-.355-.508Zm2.328 3.25c.549 0 1 .451 1 1v2c0 .549-.451 1-1 1-.549 0-1-.451-1-1v-2c0-.549.451-1 1-1Zm-5 0c.549 0 1 .451 1 1v2c0 .549-.451 1-1 1-.549 0-1-.451-1-1v-2c0-.549.451-1 1-1Zm3.313-6.185c.136 1.057.403 1.913.878 2.497.442.544 1.134.938 2.344.938 1.573 0 2.292-.337 2.657-.751.384-.435.558-1.15.558-2.361 0-1.14-.243-1.847-.705-2.319-.477-.488-1.319-.862-2.824-1.025-1.487-.161-2.192.138-2.533.529-.269.307-.437.808-.438 1.578v.021c0 .265.021.562.063.893Zm-1.626 0c.042-.331.063-.628.063-.894v-.02c-.001-.77-.169-1.271-.438-1.578-.341-.391-1.046-.69-2.533-.529-1.505.163-2.347.537-2.824 1.025-.462.472-.705 1.179-.705 2.319 0 1.211.175 1.926.558 2.361.365.414 1.084.751 2.657.751 1.21 0 1.902-.394 2.344-.938.475-.584.742-1.44.878-2.497Z"/></symbol>
    <symbol id="ic-cursor" viewBox="0 0 24 24"><path fill-rule="evenodd" fill="#0f172a" d="M11.503.131 1.891 5.678a.84.84 0 0 0-.42.726v11.188c0 .3.162.575.42.724l9.609 5.55a1 1 0 0 0 .998 0l9.61-5.55a.84.84 0 0 0 .42-.724V6.404a.84.84 0 0 0-.42-.726L12.497.131a1.01 1.01 0 0 0-.996 0M2.657 6.338h18.55c.263 0 .43.287.297.515L12.23 22.918c-.062.107-.229.064-.229-.06V12.335a.59.59 0 0 0-.295-.51l-9.11-5.257c-.109-.063-.064-.23.061-.23"/></symbol>
    <symbol id="ic-antigravity" viewBox="0 0 24 24"><path fill-rule="evenodd" fill="#0f172a" d="M21.751 22.607c1.34 1.005 3.35.335 1.508-1.508C17.73 15.74 18.904 1 12.037 1 5.17 1 6.342 15.74.815 21.1c-2.01 2.009.167 2.511 1.507 1.506 5.192-3.517 4.857-9.714 9.715-9.714 4.857 0 4.522 6.197 9.714 9.715z"/></symbol>
  </defs>

  <rect width="1240" height="664" fill="#f8fafc"/>
  <rect width="1240" height="664" fill="url(#grid)"/>

  <text x="40" y="44" class="title">Five identities, one triple each</text>
  <text x="40" y="68" class="sub">A task row names an identity. Config turns it into a CLI, a model and an effort.</text>

  <!-- ===== Column 1: identities ===== -->
  <text x="40" y="112" class="group">CORE · ALWAYS CONFIGURED</text>

  <rect x="40" y="124" width="330" height="62" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="40" y="124" width="6" height="62" rx="3" fill="#4f46e5"/>
  <text x="60" y="150" class="name m" style="fill:#4f46e5">deep_reasoner</text>
  <text x="60" y="172" class="line">ambiguous work · reviews every plan</text>

  <rect x="40" y="196" width="330" height="62" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="40" y="196" width="6" height="62" rx="3" fill="#d97706"/>
  <text x="60" y="222" class="name m" style="fill:#b45309">fast_worker</text>
  <text x="60" y="244" class="line">mechanical, spec-complete work</text>

  <rect x="40" y="268" width="330" height="62" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="40" y="268" width="6" height="62" rx="3" fill="#be185d"/>
  <text x="60" y="294" class="name m" style="fill:#be185d">arbiter</text>
  <text x="60" y="316" class="line">second solver · rules on disputes</text>

  <text x="40" y="366" class="group">OPTIONAL · --with-e2e</text>
  <rect x="32" y="376" width="346" height="150" rx="10" fill="none" stroke="#94a3b8" stroke-dasharray="6,4"/>

  <rect x="40" y="386" width="330" height="62" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="40" y="386" width="6" height="62" rx="3" fill="#0891b2"/>
  <text x="60" y="412" class="name m" style="fill:#0e7490">e2e_specifier</text>
  <text x="60" y="434" class="line">writes the acceptance tests</text>

  <rect x="40" y="456" width="330" height="62" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="40" y="456" width="6" height="62" rx="3" fill="#0891b2"/>
  <text x="60" y="482" class="name m" style="fill:#0e7490">e2e_verifier</text>
  <text x="60" y="504" class="line">runs them, returns a verdict</text>

  <text x="40" y="546" class="group">NOT AN IDENTITY</text>
  <rect x="40" y="556" width="330" height="76" rx="8" fill="#fdf2ee" stroke="#f5cdbf" stroke-dasharray="6,4"/>
  <text x="60" y="580" class="name" style="fill:#b4532f">the driver itself</text>
  <text x="60" y="600" class="line">the split · integration · critical paths · acceptance</text>
  <text x="60" y="619" class="small">runs inline · identity column reads <tspan class="m">-</tspan></text>

  <!-- bracket from identities into resolve -->
  <path d="M 384 150 H 398 V 500 H 384" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="398" y1="318" x2="440" y2="318" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="420" y="304" class="small m" text-anchor="middle">--role</text>

  <!-- ===== Column 2: resolution stack ===== -->
  <text x="450" y="112" class="group">RESOLVE · FIRST VALUE WINS, PER FIELD</text>

  <rect x="450" y="190" width="290" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="470" y="219" class="line">session override</text>
  <rect x="450" y="244" width="290" height="46" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="470" y="273" class="line m" style="fill:#0f172a">.handoff/config.toml</text>
  <rect x="450" y="298" width="290" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="470" y="327" class="line m" style="fill:#0f172a">~/.config/handoff/config.toml</text>
  <rect x="450" y="352" width="290" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="470" y="381" class="line">built-in defaults</text>
  <text x="726" y="273" class="small" text-anchor="end">project</text>
  <text x="726" y="219" class="small" text-anchor="end">this run</text>

  <rect x="450" y="424" width="290" height="44" rx="8" fill="#fff1f2" stroke="#fda4af"/>
  <text x="470" y="451" class="stop">no config found → hard error, never a guess</text>

  <line x1="740" y1="294" x2="786" y2="294" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ===== Column 3: the triple ===== -->
  <text x="796" y="112" class="group">THE IDENTITY</text>
  <rect x="796" y="176" width="190" height="236" rx="10" fill="#ffffff" stroke="#475569" stroke-width="1.4"/>
  <rect x="812" y="194" width="158" height="38" rx="19" fill="#f1f5f9"/>
  <text x="891" y="218" class="chip" text-anchor="middle">backend</text>
  <rect x="812" y="242" width="158" height="38" rx="19" fill="#f1f5f9"/>
  <text x="891" y="266" class="chip" text-anchor="middle">model</text>
  <rect x="812" y="290" width="158" height="38" rx="19" fill="#f1f5f9"/>
  <text x="891" y="314" class="chip" text-anchor="middle">effort</text>
  <rect x="812" y="346" width="158" height="38" rx="19" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="4,3"/>
  <text x="891" y="370" class="small" text-anchor="middle">permission_mode</text>

  <!-- fan out from backend -->
  <path d="M 986 213 C 1010 213, 1010 159, 1036 159" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 986 253 C 1010 253, 1010 234, 1036 234" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 986 294 C 1010 294, 1010 309, 1036 309" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 986 335 C 1010 335, 1010 384, 1036 384" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 986 375 C 1010 375, 1010 459, 1036 459" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ===== Column 4: CLI and meter ===== -->
  <text x="1040" y="112" class="group">RUNS ON · BILLS TO</text>

  <rect x="1040" y="128" width="170" height="62" rx="31" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <use href="#ic-codex" x="1052" y="141" width="18" height="18"/>
  <text x="1136" y="154" class="chip m" style="fill:#334155" text-anchor="middle">codex exec</text>
  <text x="1125" y="174" class="small" text-anchor="middle">Codex subscription</text>

  <rect x="1040" y="203" width="170" height="62" rx="31" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <use href="#ic-claude" x="1052" y="216" width="18" height="18"/>
  <text x="1136" y="229" class="chip m" style="fill:#c2410c" text-anchor="middle">claude --print</text>
  <text x="1125" y="249" class="small" font-size="11" text-anchor="middle">Claude subscription or API</text>

  <rect x="1040" y="278" width="170" height="62" rx="31" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <use href="#ic-copilot" x="1052" y="291" width="18" height="18"/>
  <text x="1136" y="304" class="chip m" style="fill:#1d4ed8" text-anchor="middle">copilot -p</text>
  <text x="1125" y="324" class="small" text-anchor="middle">Copilot AI credits</text>

  <rect x="1040" y="353" width="170" height="62" rx="31" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <use href="#ic-cursor" x="1052" y="366" width="18" height="18"/>
  <text x="1136" y="379" class="chip m" style="fill:#15803d" text-anchor="middle">cursor-agent -p</text>
  <text x="1125" y="399" class="small" text-anchor="middle">Cursor meter</text>

  <rect x="1040" y="428" width="170" height="62" rx="31" fill="#fdf4ff" stroke="#a21caf" stroke-width="1.5"/>
  <use href="#ic-antigravity" x="1052" y="441" width="18" height="18"/>
  <text x="1136" y="454" class="chip m" style="fill:#a21caf" text-anchor="middle">agy -p</text>
  <text x="1125" y="474" class="small" text-anchor="middle">Antigravity meter</text>

  <rect x="796" y="516" width="414" height="60" rx="8" fill="#fff1f2" stroke="#fda4af"/>
  <text x="816" y="542" class="stop">a per-job --backend that contradicts the role → refused</text>
  <text x="816" y="562" class="small">changing the vendor is a config change you can see</text>
</svg>
