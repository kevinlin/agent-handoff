<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 664">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0f172a; }
    .m { font-family: "SF Mono", Menlo, Consolas, ui-monospace, monospace; }
    .title { font-size: 22px; font-weight: 700; }
    .sub { font-size: 14px; fill: #64748b; }
    .group { font-size: 12px; font-weight: 700; fill: #64748b; letter-spacing: 0.08em; }
    .name { font-size: 15px; font-weight: 700; }
    .line { font-size: 13px; fill: #475569; }
    .small { font-size: 12px; fill: #64748b; }
    .chip { font-size: 13px; font-weight: 600; }
    .stop { font-size: 12px; font-weight: 600; fill: #be123c; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e6ebf2" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1240" height="664" fill="#f8fafc"/>
  <rect width="1240" height="664" fill="url(#grid)"/>

  <text x="40" y="44" class="title">Five identities, one triple each</text>
  <text x="40" y="68" class="sub">A task row names an identity. Config turns it into a CLI, a model and an effort.</text>

  <!-- ===== Column 1: identities ===== -->
  <text x="40" y="112" class="group">CORE · ALWAYS CONFIGURED</text>

  <rect x="40" y="124" width="330" height="62" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="40" y="124" width="6" height="62" rx="3" fill="#4f46e5"/>
  <text x="60" y="150" class="name m" fill="#4f46e5">deep_reasoner</text>
  <text x="60" y="172" class="line">ambiguous work · reviews every plan</text>

  <rect x="40" y="196" width="330" height="62" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="40" y="196" width="6" height="62" rx="3" fill="#d97706"/>
  <text x="60" y="222" class="name m" fill="#b45309">fast_worker</text>
  <text x="60" y="244" class="line">mechanical, spec-complete work</text>

  <rect x="40" y="268" width="330" height="62" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="40" y="268" width="6" height="62" rx="3" fill="#be185d"/>
  <text x="60" y="294" class="name m" fill="#be185d">arbiter</text>
  <text x="60" y="316" class="line">second solver · rules on disputes</text>

  <text x="40" y="366" class="group">OPTIONAL · --with-e2e</text>
  <rect x="32" y="376" width="346" height="150" rx="10" fill="none" stroke="#94a3b8" stroke-dasharray="6,4"/>

  <rect x="40" y="386" width="330" height="62" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="40" y="386" width="6" height="62" rx="3" fill="#0891b2"/>
  <text x="60" y="412" class="name m" fill="#0e7490">e2e_specifier</text>
  <text x="60" y="434" class="line">writes the acceptance tests</text>

  <rect x="40" y="456" width="330" height="62" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="40" y="456" width="6" height="62" rx="3" fill="#0891b2"/>
  <text x="60" y="482" class="name m" fill="#0e7490">e2e_verifier</text>
  <text x="60" y="504" class="line">runs them, returns a verdict</text>

  <text x="40" y="546" class="group">NOT AN IDENTITY</text>
  <rect x="40" y="556" width="330" height="76" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-dasharray="6,4"/>
  <text x="60" y="580" class="name" fill="#6d28d9">the driver itself</text>
  <text x="60" y="600" class="line">the split · integration · critical paths · acceptance</text>
  <text x="60" y="619" class="small">runs inline · identity column reads <tspan class="m">-</tspan></text>

  <!-- bracket from identities into resolve -->
  <path d="M 384 150 H 398 V 500 H 384" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="398" y1="318" x2="440" y2="318" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="420" y="304" class="small m" text-anchor="middle">--role</text>

  <!-- ===== Column 2: resolution stack ===== -->
  <text x="450" y="112" class="group">RESOLVE · FIRST VALUE WINS, PER FIELD</text>

  <rect x="450" y="190" width="290" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="470" y="219" class="line">session override</text>
  <rect x="450" y="244" width="290" height="46" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="470" y="273" class="line m" fill="#0f172a">.handoff/config.toml</text>
  <rect x="450" y="298" width="290" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="470" y="327" class="line m" fill="#0f172a">~/.config/handoff/config.toml</text>
  <rect x="450" y="352" width="290" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="470" y="381" class="line">built-in defaults</text>
  <text x="726" y="273" class="small" text-anchor="end">project</text>
  <text x="726" y="219" class="small" text-anchor="end">this run</text>

  <rect x="450" y="424" width="290" height="44" rx="8" fill="#fff1f2" stroke="#fda4af"/>
  <text x="470" y="451" class="stop">no config found → hard error, never a guess</text>

  <line x1="740" y1="294" x2="786" y2="294" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ===== Column 3: the triple ===== -->
  <text x="796" y="112" class="group">THE IDENTITY</text>
  <rect x="796" y="176" width="190" height="236" rx="10" fill="#ffffff" stroke="#475569" stroke-width="1.4"/>
  <rect x="812" y="194" width="158" height="38" rx="19" fill="#f1f5f9"/>
  <text x="891" y="218" class="chip" text-anchor="middle">backend</text>
  <rect x="812" y="242" width="158" height="38" rx="19" fill="#f1f5f9"/>
  <text x="891" y="266" class="chip" text-anchor="middle">model</text>
  <rect x="812" y="290" width="158" height="38" rx="19" fill="#f1f5f9"/>
  <text x="891" y="314" class="chip" text-anchor="middle">effort</text>
  <rect x="812" y="346" width="158" height="38" rx="19" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="4,3"/>
  <text x="891" y="370" class="small" text-anchor="middle">permission_mode</text>

  <!-- fan out from backend -->
  <path d="M 986 213 C 1010 213, 1010 170, 1036 170" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="986" y1="294" x2="1036" y2="294" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 986 375 C 1010 375, 1010 418, 1036 418" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ===== Column 4: CLI and meter ===== -->
  <text x="1040" y="112" class="group">RUNS ON · BILLS TO</text>

  <rect x="1040" y="140" width="170" height="62" rx="31" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="1125" y="166" class="chip m" fill="#334155" text-anchor="middle">codex exec</text>
  <text x="1125" y="186" class="small" text-anchor="middle">Codex subscription</text>

  <rect x="1040" y="263" width="170" height="62" rx="31" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="1125" y="289" class="chip m" fill="#c2410c" text-anchor="middle">claude --print</text>
  <text x="1125" y="309" class="small" font-size="11" text-anchor="middle">Claude subscription or API</text>

  <rect x="1040" y="386" width="170" height="62" rx="31" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="1125" y="412" class="chip m" fill="#1d4ed8" text-anchor="middle">copilot -p</text>
  <text x="1125" y="432" class="small" text-anchor="middle">Copilot AI credits</text>

  <rect x="796" y="500" width="414" height="60" rx="8" fill="#fff1f2" stroke="#fda4af"/>
  <text x="816" y="526" class="stop">a per-job --backend that contradicts the role → refused</text>
  <text x="816" y="546" class="small">changing the vendor is a config change you can see</text>
</svg>
