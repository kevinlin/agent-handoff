<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 590">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0f172a; }
    .m { font-family: "SF Mono", Menlo, Consolas, ui-monospace, monospace; }
    .title { font-size: 22px; font-weight: 700; }
    .sub { font-size: 14px; fill: #64748b; }
    .name { font-size: 15px; font-weight: 700; }
    .line { font-size: 13px; fill: #475569; }
    .small { font-size: 12px; fill: #64748b; }
    .head { font-size: 12px; font-weight: 700; fill: #64748b; letter-spacing: 0.06em; }
    .tag { font-size: 12px; font-weight: 600; fill: #475569; }
    .rose { font-size: 13px; fill: #9f1239; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e6ebf2" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e11d48"/>
    </marker>
  </defs>

  <rect width="1240" height="590" fill="#f8fafc"/>
  <rect width="1240" height="590" fill="url(#grid)"/>

  <text x="40" y="44" class="title">A job's life: four states, and what a fix round inherits</text>
  <text x="40" y="68" class="sub">The state is derived from files, so a crashed or rebooted session still reports what happened.</text>

  <!-- state machine -->
  <circle cx="80" cy="200" r="12" fill="#475569"/>
  <text x="80" y="236" class="tag" text-anchor="middle">submit</text>
  <line x1="96" y1="200" x2="176" y2="200" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="180" y="168" width="170" height="64" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="265" y="196" class="name m" fill="#1d4ed8" text-anchor="middle">RUNNING</text>
  <text x="265" y="218" class="small" text-anchor="middle">its process is alive</text>

  <path d="M 350 186 C 400 186, 410 140, 466 140" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="350" y1="200" x2="466" y2="200" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 350 214 C 400 214, 410 260, 466 260" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="470" y="112" width="190" height="56" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
  <text x="565" y="138" class="name m" fill="#047857" text-anchor="middle">DONE</text>
  <text x="565" y="158" class="small m" text-anchor="middle">exit_code = 0</text>

  <rect x="470" y="172" width="190" height="56" rx="9" fill="#fff1f2" stroke="#e11d48" stroke-width="1.6"/>
  <text x="565" y="198" class="name m" fill="#be123c" text-anchor="middle">FAILED</text>
  <text x="565" y="218" class="small" text-anchor="middle">bad exit, or a dead process</text>

  <rect x="470" y="232" width="190" height="56" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="565" y="258" class="name m" fill="#475569" text-anchor="middle">CANCELLED</text>
  <text x="565" y="278" class="small" text-anchor="middle">you or the loop stopped it</text>

  <line x1="660" y1="200" x2="726" y2="200" stroke="#e11d48" stroke-width="1.6" marker-end="url(#arrow-rose)"/>
  <path d="M 265 232 V 336 H 726 V 296" fill="none" stroke="#e11d48" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-rose)"/>
  <text x="420" y="354" class="tag" fill="#be123c" text-anchor="middle">running, but quiet for two ticks</text>

  <rect x="730" y="110" width="290" height="220" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="1.6"/>
  <text x="752" y="142" class="name" fill="#be123c">treat it as an anomaly</text>
  <text x="752" y="170" class="head">WHAT COUNTS</text>
  <text x="752" y="194" class="rose">a job that failed</text>
  <text x="752" y="216" class="rose">a job that went quiet</text>
  <text x="752" y="238" class="rose">a finished job whose tool calls were denied</text>
  <line x1="752" y1="256" x2="998" y2="256" stroke="#fda4af"/>
  <text x="752" y="280" class="line">cancel it, then read the logs</text>
  <text x="752" y="302" class="line">resubmit corrected, or take it back</text>
  <text x="752" y="322" class="small">either way it goes in the receipt</text>

  <rect x="1040" y="110" width="170" height="120" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="1060" y="140" class="name">the evidence</text>
  <text x="1060" y="166" class="small m">pid</text>
  <text x="1060" y="186" class="small m">exit_code</text>
  <text x="1060" y="206" class="small m">cancelled</text>
  <text x="1060" y="222" class="small">files, not memory</text>

  <!-- resume chain -->
  <text x="40" y="404" class="head">A FIX ROUND IS A RESUME OF THE SAME SESSION — AND IT COUNTS AS A REVIEW PASS</text>

  <rect x="40" y="424" width="200" height="70" rx="9" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="140" y="452" class="line m" text-anchor="middle">job-t2</text>
  <text x="140" y="476" class="small" text-anchor="middle">pass 1 — the original</text>

  <line x1="240" y1="459" x2="276" y2="459" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="280" y="424" width="200" height="70" rx="9" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="380" y="452" class="line m" text-anchor="middle">job-t2-r2</text>
  <text x="380" y="476" class="small" text-anchor="middle">pass 2 — findings only</text>

  <line x1="480" y1="459" x2="516" y2="459" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="520" y="424" width="200" height="70" rx="9" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="620" y="452" class="line m" text-anchor="middle">job-t2-r3</text>
  <text x="620" y="476" class="small" text-anchor="middle">pass 3 — the last one</text>

  <line x1="720" y1="459" x2="756" y2="459" stroke="#e11d48" stroke-width="1.6" marker-end="url(#arrow-rose)"/>

  <rect x="760" y="424" width="210" height="70" rx="9" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
  <text x="865" y="452" class="line" fill="#be123c" text-anchor="middle">a fourth is refused</text>
  <text x="865" y="476" class="small" text-anchor="middle">before the job exists</text>

  <line x1="970" y1="459" x2="1006" y2="459" stroke="#e11d48" stroke-width="1.6" marker-end="url(#arrow-rose)"/>

  <rect x="1010" y="424" width="200" height="70" rx="9" fill="#fdf2f8" stroke="#be185d" stroke-width="1.5"/>
  <text x="1110" y="452" class="line m" fill="#be185d" text-anchor="middle">arbiter</text>
  <text x="1110" y="476" class="small" text-anchor="middle">rules on the dispute</text>

  <path d="M 40 512 V 528 H 720 V 512" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="380" y="552" class="small" text-anchor="middle">each round inherits the session, the backend and the worktree — and carries only the findings and the failed criteria</text>
</svg>
