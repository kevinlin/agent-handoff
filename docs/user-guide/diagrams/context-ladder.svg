<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 390">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0f172a; }
    .m { font-family: "SF Mono", Menlo, Consolas, ui-monospace, monospace; }
    .title { font-size: 22px; font-weight: 700; }
    .sub { font-size: 14px; fill: #64748b; }
    .name { font-size: 13px; font-weight: 700; }
    .small { font-size: 12px; fill: #64748b; }
    .num { font-size: 12px; font-weight: 700; fill: #ffffff; }
    .axis { font-size: 12px; font-weight: 600; fill: #64748b; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e6ebf2" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1240" height="390" fill="#f8fafc"/>
  <rect width="1240" height="390" fill="url(#grid)"/>

  <text x="40" y="44" class="title">What crosses: the cheapest thing that unblocks the work</text>
  <text x="40" y="68" class="sub">The driver has already read the repo. It picks the evidence once, so the worker spends its tokens on the work instead of the search.</text>

  <line x1="40" y1="112" x2="1220" y2="112" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="40" y="102" class="axis">cheap, and usually enough</text>
  <text x="1220" y="102" class="axis" text-anchor="end">expensive, and rarely needed</text>

  <g transform="translate(0,-110)">
  <g>
    <rect x="40" y="330" width="180" height="70" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <circle cx="64" cy="354" r="11" fill="#059669"/><text x="64" y="358" class="num" text-anchor="middle">1</text>
    <text x="82" y="358" class="name">why, and what</text>
    <text x="58" y="382" class="small">the purpose, the one task,</text>
    <text x="58" y="396" class="small">and how it will be checked</text>
  </g>
  <g>
    <rect x="240" y="310" width="180" height="90" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <circle cx="264" cy="334" r="11" fill="#059669"/><text x="264" y="338" class="num" text-anchor="middle">2</text>
    <text x="282" y="338" class="name">the shape</text>
    <text x="258" y="362" class="small">which files changed and</text>
    <text x="258" y="376" class="small">by how much — not their</text>
    <text x="258" y="390" class="small">contents</text>
  </g>
  <g>
    <rect x="440" y="290" width="180" height="110" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
    <circle cx="464" cy="314" r="11" fill="#059669"/><text x="464" y="318" class="num" text-anchor="middle">3</text>
    <text x="482" y="318" class="name">the evidence</text>
    <text x="458" y="342" class="small">the tail of the check that</text>
    <text x="458" y="356" class="small">failed, summarised</text>
  </g>
  <g>
    <rect x="640" y="270" width="180" height="130" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <circle cx="664" cy="294" r="11" fill="#d97706"/><text x="664" y="298" class="num" text-anchor="middle">4</text>
    <text x="682" y="298" class="name">what was asked for</text>
    <text x="658" y="322" class="small">the snippet the worker</text>
    <text x="658" y="336" class="small">came back and asked for</text>
  </g>
  <g>
    <rect x="840" y="250" width="180" height="150" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <circle cx="864" cy="274" r="11" fill="#d97706"/><text x="864" y="278" class="num" text-anchor="middle">5</text>
    <text x="882" y="278" class="name">a whole file</text>
    <text x="858" y="302" class="small">only a small one; a large</text>
    <text x="858" y="316" class="small">file goes in as the part</text>
    <text x="858" y="330" class="small">that carries the decision</text>
  </g>
  <g>
    <rect x="1040" y="230" width="180" height="170" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="6,4"/>
    <circle cx="1064" cy="254" r="11" fill="#e11d48"/>
    <path d="M 1060 250 l 8 8 M 1068 250 l -8 8" stroke="#ffffff" stroke-width="1.8"/>
    <text x="1082" y="258" class="name" fill="#be123c">the repository</text>
    <text x="1058" y="282" class="small">paying a second agent to</text>
    <text x="1058" y="296" class="small">rediscover the repo is the</text>
    <text x="1058" y="310" class="small">cost this whole thing</text>
    <text x="1058" y="324" class="small">exists to avoid</text>
  </g>

  <path d="M 1130 414 H 130" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="630" y="450" class="small" text-anchor="middle">the worker asks for the next rung when it needs it — context is pulled, not pushed</text>
  </g>
</svg>
