<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 730">
  <style>
    text { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', ui-monospace, monospace; }
    .title { font-size: 21.6px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-size: 12.6px; fill: #64748b; }
    .colhead { font-size: 14.4px; font-weight: 700; fill: #334155; }
    .rung { font-size: 14.4px; font-weight: 700; fill: #0f172a; }
    .note { font-size: 12px; fill: #475569; }
    .num { font-size: 14.4px; font-weight: 700; fill: #ffffff; }
    .cardtitle { font-size: 13.8px; font-weight: 700; fill: #0f172a; }
    .line { font-size: 12px; fill: #475569; }
    .warn { font-size: 12px; fill: #be123c; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e6ebf2" stroke-width="0.5"/>
    </pattern>
    <marker id="down" markerWidth="10" markerHeight="7" refX="5" refY="6" orient="auto">
      <polygon points="0 0, 10 0, 5 7" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1240" height="730" fill="#f8fafc"/>
  <rect width="1240" height="730" fill="url(#grid)"/>

  <text x="40" y="42" class="title">Building the other agent's context</text>
  <text x="40" y="64" class="subtitle">Enough for the delegate to decide, never enough to make it re-read the repository</text>

  <text x="50" y="110" class="colhead">EVIDENCE LADDER — send the cheapest rung that unblocks the ask</text>
  <text x="650" y="110" class="colhead">RULES THAT KEEP THE PACKET BOUNDED</text>

  <!-- rungs -->
  <rect x="50" y="126" width="580" height="80" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.4"/>
  <circle cx="82" cy="152" r="13" fill="#059669"/>
  <text x="82" y="157" class="num" text-anchor="middle">1</text>
  <text x="108" y="157" class="rung">Why-forward context and the one-line task</text>
  <text x="108" y="178" class="note">the purpose the work serves, then the single ask,</text>
  <text x="108" y="195" class="note">then acceptance written as a command to run</text>

  <rect x="50" y="216" width="580" height="80" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.4"/>
  <circle cx="82" cy="242" r="13" fill="#059669"/>
  <text x="82" y="247" class="num" text-anchor="middle">2</text>
  <text x="108" y="247" class="rung">Changed files and git diff --stat</text>
  <text x="108" y="268" class="note">the shape of the change without its content;</text>
  <text x="108" y="285" class="note">scoped to the package path in a monorepo</text>

  <rect x="50" y="306" width="580" height="80" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.4"/>
  <circle cx="82" cy="332" r="13" fill="#059669"/>
  <text x="82" y="337" class="num" text-anchor="middle">3</text>
  <text x="108" y="337" class="rung">Check output, tail only</text>
  <text x="108" y="358" class="note">the fastest relevant command and its last ~20 lines,</text>
  <text x="108" y="375" class="note">summarized rather than pasted whole</text>

  <rect x="50" y="396" width="580" height="80" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.4"/>
  <circle cx="82" cy="422" r="13" fill="#d97706"/>
  <text x="82" y="427" class="num" text-anchor="middle">4</text>
  <text x="108" y="427" class="rung">The snippet the receiver asked for</text>
  <text x="108" y="448" class="note">"if you need more context, ask for the smallest file</text>
  <text x="108" y="465" class="note">or snippet that unblocks the review"</text>

  <rect x="50" y="486" width="580" height="80" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.4"/>
  <circle cx="82" cy="512" r="13" fill="#d97706"/>
  <text x="82" y="517" class="num" text-anchor="middle">5</text>
  <text x="108" y="517" class="rung">Whole files — only small ones</text>
  <text x="108" y="538" class="note">full diffs belong to small files; a large file goes</text>
  <text x="108" y="555" class="note">in as the excerpt that carries the decision</text>

  <rect x="50" y="576" width="580" height="80" rx="8" fill="#fff5f6" stroke="#e11d48" stroke-width="1.4" stroke-dasharray="6,4"/>
  <circle cx="82" cy="602" r="13" fill="#e11d48"/>
  <text x="82" y="607" class="num" text-anchor="middle">✕</text>
  <text x="108" y="607" class="rung" fill="#be123c">The repository</text>
  <text x="108" y="628" class="warn">paying a second agent to rediscover the repo is the</text>
  <text x="108" y="645" class="warn">exact cost the whole workflow exists to avoid</text>


  <!-- rules cards -->
  <rect x="650" y="126" width="570" height="100" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="670" y="152" class="cardtitle">The sender gathers, the receiver decides</text>
  <text x="670" y="174" class="line">The driver reads the repo and picks what matters. Asking the</text>
  <text x="670" y="191" class="line">receiving agent to discover its own context is what turns one request</text>
  <text x="670" y="208" class="line">into a recursive scan plus a tree of metered subagents.</text>

  <rect x="650" y="236" width="570" height="100" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="670" y="262" class="cardtitle">Shaped by the situation, not by habit</text>
  <text x="670" y="284" class="line">Monorepo: scope every git command to the package and name that path</text>
  <text x="670" y="301" class="line">in the task line. Plain folder: a bounded file inventory. Debugging:</text>
  <text x="670" y="318" class="line">reproduction output and failing checks, never file dumps.</text>

  <rect x="650" y="346" width="570" height="100" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.4"/>
  <text x="670" y="372" class="cardtitle">A worktree packet has to be self-contained</text>
  <text x="670" y="394" class="line">A Git worktree receives tracked content only, and .handoff/ is</text>
  <text x="670" y="411" class="line">gitignored. So no e2e job reads the goal file: the frozen excerpt, the</text>
  <text x="670" y="428" class="line">spec, and the artifact paths all go inline into the prompt.</text>

  <rect x="650" y="456" width="570" height="100" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.4"/>
  <text x="670" y="482" class="cardtitle">Dense replies protect the other side</text>
  <text x="670" y="504" class="line">Every packet ends with the same rule: no optional commentary, at most</text>
  <text x="670" y="521" class="line">three lines of lessons. A terse reviewer contract cut reviewer output</text>
  <text x="670" y="538" class="line">by 41% with no loss of judgment quality.</text>

  <rect x="650" y="566" width="570" height="100" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="670" y="592" class="cardtitle">Carried forward, not rebuilt</text>
  <text x="670" y="614" class="line">A fix round resumes the stored session and sends findings only. A lost</text>
  <text x="670" y="631" class="line">session restarts from .handoff/goal.md plus the job directories. Standing</text>
  <text x="670" y="648" class="line">facts live in CLAUDE.md and AGENTS.md; experience lives in memory.</text>
</svg>
