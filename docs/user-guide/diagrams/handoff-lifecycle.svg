<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 690">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0f172a; }
    .m { font-family: "SF Mono", Menlo, Consolas, ui-monospace, monospace; }
    .title { font-size: 22px; font-weight: 700; }
    .sub { font-size: 14px; fill: #64748b; }
    .lane { font-size: 15px; font-weight: 700; }
    .lanesub { font-size: 12px; fill: #64748b; }
    .name { font-size: 15px; font-weight: 700; }
    .line { font-size: 13px; fill: #475569; }
    .tag { font-size: 12px; font-weight: 600; }
    .badge { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .legend { font-size: 12px; fill: #475569; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e6ebf2" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e11d48"/>
    </marker>
    <marker id="arrow-slate" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <g id="doc">
      <path d="M0 0 H20 L30 10 V38 H0 Z" fill="#ffffff" stroke="#475569" stroke-width="1.4"/>
      <path d="M20 0 V10 H30" fill="none" stroke="#475569" stroke-width="1.4"/>
      <line x1="6" y1="18" x2="24" y2="18" stroke="#94a3b8" stroke-width="1.2"/>
      <line x1="6" y1="24" x2="24" y2="24" stroke="#94a3b8" stroke-width="1.2"/>
      <line x1="6" y1="30" x2="18" y2="30" stroke="#94a3b8" stroke-width="1.2"/>
    </g>
  </defs>

  <rect width="1320" height="690" fill="#f8fafc"/>
  <rect width="1320" height="690" fill="url(#grid)"/>

  <text x="24" y="44" class="title">How Agent Handoff runs</text>
  <text x="24" y="68" class="sub">The driver plans, delegates, watches and reviews. The worker does the work. Every step leaves a file behind.</text>

  <!-- lanes -->
  <rect x="24" y="92" width="1272" height="220" rx="10" fill="rgba(124,58,237,0.05)" stroke="#ddd6fe"/>
  <rect x="24" y="92" width="140" height="220" rx="10" fill="rgba(124,58,237,0.08)"/>
  <text x="40" y="196" class="lane" fill="#7c3aed">Claude Code</text>
  <text x="40" y="218" class="lanesub">the driver</text>

  <rect x="24" y="330" width="1272" height="170" rx="10" fill="rgba(217,119,6,0.05)" stroke="#fde68a"/>
  <rect x="24" y="330" width="140" height="170" rx="10" fill="rgba(217,119,6,0.09)"/>
  <text x="40" y="404" class="lane" fill="#b45309">Worker CLI</text>
  <text x="40" y="426" class="lanesub">background job</text>

  <rect x="24" y="518" width="1272" height="106" rx="10" fill="rgba(100,116,139,0.05)" stroke="#cbd5e1"/>
  <rect x="24" y="518" width="140" height="106" rx="10" fill="rgba(100,116,139,0.09)"/>
  <text x="40" y="566" class="lane m" fill="#475569">.handoff/</text>
  <text x="40" y="588" class="lanesub">state on disk</text>

  <!-- state links -->
  <line x1="250" y1="251" x2="250" y2="546" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arrow-slate)"/>
  <line x1="820" y1="470" x2="820" y2="546" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arrow-slate)"/>
  <line x1="1272" y1="251" x2="1272" y2="546" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arrow-slate)"/>

  <!-- flow arrows -->
  <line x1="320" y1="215" x2="342" y2="215" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="438" y1="215" x2="466" y2="215" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="452" y="205" class="tag" fill="#059669" text-anchor="middle">yes</text>
  <line x1="610" y1="215" x2="656" y2="215" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="790" y1="215" x2="826" y2="215" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="960" y1="215" x2="996" y2="215" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="978" y="205" class="tag" fill="#475569" text-anchor="middle">done</text>
  <line x1="1120" y1="215" x2="1146" y2="215" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="1133" y="205" class="tag" fill="#059669" text-anchor="middle">pass</text>

  <path d="M 392 171 V 134 H 250 V 175" fill="none" stroke="#e11d48" stroke-width="1.6" marker-end="url(#arrow-rose)"/>
  <text x="321" y="126" class="tag" fill="#e11d48" text-anchor="middle">no: fix the split first</text>

  <line x1="725" y1="251" x2="725" y2="346" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="735" y="300" class="tag" fill="#475569">submit</text>
  <line x1="900" y1="350" x2="900" y2="255" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="888" y="300" class="tag" fill="#475569" text-anchor="end">status</text>

  <path d="M 1060 261 V 412 H 1010" fill="none" stroke="#e11d48" stroke-width="1.6" marker-end="url(#arrow-rose)"/>
  <text x="1048" y="300" class="tag" fill="#e11d48" text-anchor="end">no · fix round</text>
  <text x="1048" y="320" class="line" text-anchor="end">resume, within the cap</text>
  <path d="M 1060 412 H 1086" fill="none" stroke="#e11d48" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrow-rose)"/>

  <!-- driver steps -->
  <rect x="180" y="179" width="140" height="72" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="250" y="210" class="name" text-anchor="middle">Plan &amp; split</text>
  <text x="250" y="232" class="line" text-anchor="middle">one row, one identity</text>
  <circle cx="180" cy="179" r="12" fill="#7c3aed"/>
  <text x="180" y="184" class="badge" text-anchor="middle">1</text>

  <polygon points="392,171 438,215 392,259 346,215" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
  <text x="392" y="211" class="tag" text-anchor="middle">split</text>
  <text x="392" y="227" class="tag" text-anchor="middle">holds?</text>
  <text x="392" y="284" class="tag" fill="#e11d48" text-anchor="middle">adversarial gate</text>

  <rect x="470" y="179" width="140" height="72" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="540" y="210" class="name" text-anchor="middle">Spec review</text>
  <text x="540" y="232" class="line m" text-anchor="middle" fill="#4f46e5">deep_reasoner</text>
  <text x="540" y="284" class="tag" fill="#4f46e5" text-anchor="middle">every plan, read-only</text>

  <rect x="660" y="179" width="130" height="72" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="725" y="210" class="name" text-anchor="middle">Delegate</text>
  <text x="725" y="232" class="line" text-anchor="middle">packet + role</text>
  <circle cx="660" cy="179" r="12" fill="#7c3aed"/>
  <text x="660" y="184" class="badge" text-anchor="middle">2</text>

  <rect x="830" y="179" width="130" height="72" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="895" y="210" class="name" text-anchor="middle">Monitor</text>
  <text x="895" y="232" class="line" text-anchor="middle">loop, 5 min</text>
  <circle cx="830" cy="179" r="12" fill="#7c3aed"/>
  <text x="830" y="184" class="badge" text-anchor="middle">3</text>

  <polygon points="1060,169 1120,215 1060,261 1000,215" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="1060" y="211" class="tag" text-anchor="middle">diff meets</text>
  <text x="1060" y="227" class="tag m" text-anchor="middle">goal.md?</text>
  <circle cx="1000" cy="146" r="12" fill="#059669"/>
  <text x="1000" y="151" class="badge" text-anchor="middle">4</text>
  <text x="1020" y="151" class="name">Full review</text>

  <rect x="1150" y="179" width="140" height="72" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="1220" y="210" class="name" text-anchor="middle">Wrap up</text>
  <text x="1220" y="232" class="line" text-anchor="middle">receipt, memory</text>
  <circle cx="1150" cy="179" r="12" fill="#475569"/>
  <text x="1150" y="184" class="badge" text-anchor="middle">5</text>

  <!-- worker job -->
  <rect x="640" y="350" width="366" height="120" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="823" y="378" class="name" text-anchor="middle">One background job per row, one jobId</text>
  <rect x="658" y="394" width="102" height="30" rx="15" fill="#f1f5f9" stroke="#334155"/>
  <text x="709" y="414" class="tag m" fill="#334155" text-anchor="middle">codex</text>
  <rect x="772" y="394" width="102" height="30" rx="15" fill="#fff7ed" stroke="#c2410c"/>
  <text x="823" y="414" class="tag m" fill="#c2410c" text-anchor="middle">claude</text>
  <rect x="886" y="394" width="102" height="30" rx="15" fill="#eff6ff" stroke="#2563eb"/>
  <text x="937" y="414" class="tag m" fill="#1d4ed8" text-anchor="middle">copilot</text>
  <text x="823" y="452" class="line" text-anchor="middle">implement → run checks → report</text>

  <rect x="1090" y="372" width="160" height="80" rx="10" fill="#fdf2f8" stroke="#be185d" stroke-width="1.5"/>
  <text x="1170" y="364" class="tag" fill="#e11d48" text-anchor="middle">at the cap</text>
  <text x="1170" y="400" class="name m" fill="#be185d" text-anchor="middle">arbiter</text>
  <text x="1170" y="422" class="line" text-anchor="middle">rules on the dispute</text>
  <text x="1170" y="441" class="line" text-anchor="middle">approve · reject</text>

  <!-- files -->
  <use href="#doc" x="235" y="550"/>
  <text x="276" y="566" class="name m">goal.md</text>
  <text x="276" y="588" class="line">the plan and every status</text>

  <use href="#doc" x="805" y="550"/>
  <text x="846" y="566" class="name m">jobs/&lt;jobId&gt;/</text>
  <text x="846" y="588" class="line">prompt, log, meta</text>

  <use href="#doc" x="1257" y="550"/>
  <text x="1247" y="566" class="name m" text-anchor="end">receipts/</text>
  <text x="1247" y="588" class="line" text-anchor="end">what the run actually did</text>

  <!-- legend -->
  <line x1="24" y1="656" x2="60" y2="656" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="70" y="661" class="legend">flow</text>
  <line x1="130" y1="656" x2="166" y2="656" stroke="#e11d48" stroke-width="1.6" marker-end="url(#arrow-rose)"/>
  <text x="176" y="661" class="legend">rework</text>
  <line x1="250" y1="656" x2="286" y2="656" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arrow-slate)"/>
  <text x="296" y="661" class="legend">reads or writes state</text>
</svg>
