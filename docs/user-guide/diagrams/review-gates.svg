<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 600">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0f172a; }
    .m { font-family: "SF Mono", Menlo, Consolas, ui-monospace, monospace; }
    .title { font-size: 22px; font-weight: 700; }
    .sub { font-size: 14px; fill: #64748b; }
    .name { font-size: 15px; font-weight: 700; }
    .line { font-size: 13px; fill: #475569; }
    .small { font-size: 12px; fill: #64748b; }
    .head { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; }
    .tag { font-size: 12px; font-weight: 600; fill: #475569; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e6ebf2" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
    <marker id="arrow-pink" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#be185d"/>
    </marker>
  </defs>

  <rect width="1240" height="600" fill="#f8fafc"/>
  <rect width="1240" height="600" fill="url(#grid)"/>

  <text x="40" y="44" class="title">Two review gates, one shape</text>
  <text x="40" y="68" class="sub">The same four moves run in both gates. Only the seats change.</text>

  <!-- band A -->
  <rect x="24" y="100" width="916" height="170" rx="12" fill="rgba(79,70,229,0.05)" stroke="#c7d2fe"/>
  <text x="44" y="126" class="head" fill="#4f46e5">SPEC REVIEW · THE PLAN, BEFORE ANYTHING IS BUILT</text>

  <rect x="44" y="170" width="150" height="60" rx="9" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="119" y="196" class="line" text-anchor="middle">the driver</text>
  <text x="119" y="216" class="small" text-anchor="middle">writes the plan</text>
  <line x1="194" y1="200" x2="210" y2="200" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="214" y="170" width="130" height="60" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="279" y="196" class="line m" text-anchor="middle">goal.md</text>
  <text x="279" y="216" class="small" text-anchor="middle">the plan</text>
  <line x1="344" y1="200" x2="360" y2="200" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="364" y="170" width="160" height="60" rx="9" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="444" y="196" class="line m" fill="#4f46e5" text-anchor="middle">deep_reasoner</text>
  <text x="444" y="216" class="small" text-anchor="middle">reads it, read-only</text>
  <line x1="524" y1="200" x2="540" y2="200" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="544" y="170" width="140" height="60" rx="9" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  <text x="614" y="194" class="line" text-anchor="middle">every blocker</text>
  <text x="614" y="214" class="line" text-anchor="middle">settled?</text>

  <line x1="684" y1="200" x2="700" y2="200" stroke="#059669" stroke-width="1.6" marker-end="url(#arrow-green)"/>
  <rect x="704" y="170" width="212" height="60" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="810" y="196" class="line" text-anchor="middle">the plan reaches you</text>
  <text x="810" y="216" class="small" text-anchor="middle">adjusted, not just reviewed</text>

  <path d="M 614 170 V 146 H 444 V 166" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="529" y="140" class="tag" text-anchor="middle">one more pass, if the cap allows it</text>

  <!-- band B -->
  <rect x="24" y="330" width="916" height="170" rx="12" fill="rgba(217,119,6,0.05)" stroke="#fde68a"/>
  <text x="44" y="356" class="head" fill="#b45309">IMPLEMENTATION REVIEW · THE DIFF THAT CAME BACK</text>

  <rect x="44" y="400" width="150" height="60" rx="9" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="119" y="426" class="line" text-anchor="middle">the worker</text>
  <text x="119" y="446" class="small" text-anchor="middle">did the work</text>
  <line x1="194" y1="430" x2="210" y2="430" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="214" y="400" width="130" height="60" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="279" y="426" class="line" text-anchor="middle">the whole diff</text>
  <text x="279" y="446" class="small" text-anchor="middle">never a sample</text>
  <line x1="344" y1="430" x2="360" y2="430" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="364" y="400" width="160" height="60" rx="9" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="444" y="426" class="line" fill="#6d28d9" text-anchor="middle">the driver</text>
  <text x="444" y="446" class="small" text-anchor="middle">reads it against the brief</text>
  <line x1="524" y1="430" x2="540" y2="430" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="544" y="400" width="140" height="60" rx="9" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  <text x="614" y="424" class="line" text-anchor="middle">every finding</text>
  <text x="614" y="444" class="line" text-anchor="middle">settled?</text>

  <line x1="684" y1="430" x2="700" y2="430" stroke="#059669" stroke-width="1.6" marker-end="url(#arrow-green)"/>
  <rect x="704" y="400" width="212" height="60" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="810" y="426" class="line" text-anchor="middle">the row is done</text>
  <text x="810" y="446" class="small" text-anchor="middle">and the receipt says so</text>

  <path d="M 614 460 V 484 H 444 V 464" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="529" y="500" class="tag" text-anchor="middle">a fix round, while passes are left</text>

  <!-- escalation -->
  <path d="M 614 230 V 300 H 976" fill="none" stroke="#be185d" stroke-width="1.8" marker-end="url(#arrow-pink)"/>
  <path d="M 614 400 V 300" fill="none" stroke="#be185d" stroke-width="1.8"/>
  <text x="795" y="292" class="tag" fill="#be185d" text-anchor="middle">no agreement at the cap</text>

  <rect x="980" y="230" width="230" height="170" rx="12" fill="#fdf2f8" stroke="#be185d" stroke-width="1.6"/>
  <text x="1000" y="262" class="name m" fill="#be185d">arbiter</text>
  <text x="1000" y="284" class="small">reads both sides, rules once</text>
  <circle cx="1008" cy="312" r="7" fill="#059669"/>
  <text x="1024" y="317" class="line">approve — it stands</text>
  <circle cx="1008" cy="342" r="7" fill="#e11d48"/>
  <text x="1024" y="347" class="line">reject — it is set aside</text>
  <circle cx="1008" cy="372" r="7" fill="#94a3b8"/>
  <text x="1024" y="377" class="line">no verdict — it waits for you</text>

  <!-- caps -->
  <rect x="24" y="530" width="1186" height="52" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="44" y="562" class="line">A round is one review pass: the first read is pass one, and every fix round adds one.</text>
  <text x="700" y="562" class="line m">spec_max_rounds = 1</text>
  <text x="900" y="562" class="line m">implementation_max_rounds = 3</text>
</svg>
