<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 470">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0f172a; }
    .m { font-family: "SF Mono", Menlo, Consolas, ui-monospace, monospace; }
    .title { font-size: 22px; font-weight: 700; }
    .sub { font-size: 14px; fill: #64748b; }
    .step { font-size: 15px; font-weight: 700; }
    .line { font-size: 13px; fill: #475569; }
    .small { font-size: 12px; fill: #64748b; }
    .num { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .warn { font-size: 12px; font-weight: 600; fill: #be123c; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e6ebf2" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-slate" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1240" height="470" fill="#f8fafc"/>
  <rect width="1240" height="470" fill="url(#grid)"/>

  <text x="40" y="44" class="title">Setup: from detected CLIs to verified identities</text>
  <text x="40" y="68" class="sub m">/agent-handoff config opens one local page. Nothing is written before you have seen the diff.</text>

  <!-- steps -->
  <g>
    <rect x="40" y="120" width="170" height="104" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4"/>
    <circle cx="64" cy="144" r="13" fill="#7c3aed"/><text x="64" y="149" class="num" text-anchor="middle">1</text>
    <text x="86" y="150" class="step">Detect</text>
    <text x="58" y="180" class="line">which CLIs are here</text>
    <text x="58" y="200" class="small">models from each CLI's</text>
    <text x="58" y="216" class="small">own list, never guessed</text>
  </g>
  <g>
    <rect x="238" y="120" width="170" height="104" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4"/>
    <circle cx="262" cy="144" r="13" fill="#7c3aed"/><text x="262" y="149" class="num" text-anchor="middle">2</text>
    <text x="284" y="150" class="step">Preset</text>
    <text x="256" y="180" class="line">balanced · quality · cost</text>
    <text x="256" y="200" class="small">a starting point for the</text>
    <text x="256" y="216" class="small">whole matrix</text>
  </g>
  <g>
    <rect x="436" y="120" width="170" height="104" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4"/>
    <circle cx="460" cy="144" r="13" fill="#7c3aed"/><text x="460" y="149" class="num" text-anchor="middle">3</text>
    <text x="482" y="150" class="step">Tune</text>
    <text x="454" y="180" class="line">per identity: backend,</text>
    <text x="454" y="200" class="line">model, effort, permission</text>
    <text x="454" y="216" class="small">plus the two review caps</text>
  </g>
  <g>
    <rect x="634" y="120" width="170" height="104" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4"/>
    <circle cx="658" cy="144" r="13" fill="#7c3aed"/><text x="658" y="149" class="num" text-anchor="middle">4</text>
    <text x="680" y="150" class="step">Preview</text>
    <text x="652" y="180" class="line">the exact file diff</text>
    <text x="652" y="200" class="small">any change you make</text>
    <text x="652" y="216" class="small">invalidates it</text>
  </g>
  <g>
    <rect x="832" y="120" width="170" height="104" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4"/>
    <circle cx="856" cy="144" r="13" fill="#7c3aed"/><text x="856" y="149" class="num" text-anchor="middle">5</text>
    <text x="878" y="150" class="step">Apply</text>
    <text x="850" y="180" class="line">one atomic write</text>
    <text x="850" y="200" class="small">a backup is kept, so</text>
    <text x="850" y="216" class="small">it is undoable</text>
  </g>
  <g>
    <rect x="1030" y="120" width="170" height="104" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
    <circle cx="1054" cy="144" r="13" fill="#059669"/><text x="1054" y="149" class="num" text-anchor="middle">6</text>
    <text x="1076" y="150" class="step">Smoke</text>
    <text x="1048" y="180" class="line">each backend answers</text>
    <text x="1048" y="200" class="small">a pass writes</text>
    <text x="1048" y="216" class="small m">verified = true</text>
  </g>

  <line x1="210" y1="172" x2="234" y2="172" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="408" y1="172" x2="432" y2="172" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="606" y1="172" x2="630" y2="172" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="804" y1="172" x2="828" y2="172" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="1002" y1="172" x2="1026" y2="172" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- rollback -->
  <path d="M 880 224 V 262 H 736 V 228" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-slate)"/>
  <text x="808" y="280" class="small m" text-anchor="middle">--rollback</text>

  <!-- smoke failure -->
  <rect x="1000" y="252" width="166" height="56" rx="8" fill="#fff1f2" stroke="#fda4af"/>
  <text x="1016" y="277" class="warn">a failed check says so</text>
  <text x="1016" y="296" class="small m">verified stays false</text>
  <path d="M 1083 224 V 248" fill="none" stroke="#e11d48" stroke-width="1.4" stroke-dasharray="5,4"/>

  <!-- tryout -->
  <rect x="320" y="340" width="560" height="104" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
  <text x="344" y="372" class="step m" fill="#047857">/agent-handoff tryout</text>
  <text x="344" y="400" class="line">every identity runs one small real task, end to end</text>
  <text x="344" y="424" class="small">the report is what proves they are live on the models you picked</text>
  <path d="M 1185 224 V 392 H 884" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
</svg>
