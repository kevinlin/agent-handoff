<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 660">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0f172a; }
    .m { font-family: "SF Mono", Menlo, Consolas, ui-monospace, monospace; }
    .title { font-size: 22px; font-weight: 700; }
    .sub { font-size: 14px; fill: #64748b; }
    .name { font-size: 14px; font-weight: 700; }
    .hub { font-size: 16px; font-weight: 700; }
    .line { font-size: 13px; fill: #475569; }
    .small { font-size: 12px; fill: #64748b; }
    .head { font-size: 12px; font-weight: 700; fill: #64748b; letter-spacing: 0.06em; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e6ebf2" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-slate" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1240" height="660" fill="#f8fafc"/>
  <rect width="1240" height="660" fill="url(#grid)"/>

  <text x="40" y="44" class="title">One written goal, judged against at every stage</text>
  <text x="40" y="68" class="sub">Six stages, one reference, and a rework path with a defined end.</text>

  <!-- ring -->
  <ellipse cx="620" cy="320" rx="280" ry="170" fill="none" stroke="#ddd6fe" stroke-width="1.4" stroke-dasharray="4,6"/>
  <path d="M 716 160 A 280 170 0 0 1 800 190" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 896 291 A 280 170 0 0 1 896 350" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 800 450 A 280 170 0 0 1 716 480" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 524 480 A 280 170 0 0 1 440 450" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 344 350 A 280 170 0 0 1 344 291" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 440 190 A 280 170 0 0 1 524 160" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- spokes -->
  <g stroke="#d97706" stroke-width="1.1" stroke-dasharray="3,4">
    <line x1="620" y1="182" x2="620" y2="266"/>
    <line x1="800" y1="252" x2="740" y2="288"/>
    <line x1="800" y1="388" x2="740" y2="352"/>
    <line x1="620" y1="458" x2="620" y2="374"/>
    <line x1="440" y1="388" x2="500" y2="352"/>
    <line x1="440" y1="252" x2="500" y2="288"/>
  </g>

  <!-- hub -->
  <rect x="480" y="266" width="280" height="108" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
  <text x="620" y="300" class="hub m" text-anchor="middle">.handoff/goal.md</text>
  <text x="620" y="324" class="line" text-anchor="middle">the goal, the rows, the acceptance</text>
  <text x="620" y="348" class="small" text-anchor="middle">read or written at every stage,</text>
  <text x="620" y="364" class="small" text-anchor="middle">never rewritten to match the work</text>

  <!-- nodes -->
  <rect x="515" y="118" width="210" height="64" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="620" y="144" class="name" text-anchor="middle">Plan</text>
  <text x="620" y="166" class="small" text-anchor="middle">acceptance written before the code</text>

  <rect x="757" y="188" width="210" height="64" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="862" y="214" class="name" text-anchor="middle">Spec review</text>
  <text x="862" y="236" class="small" text-anchor="middle">an outside reader, every time</text>

  <rect x="757" y="388" width="210" height="64" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="862" y="414" class="name" text-anchor="middle">Delegate</text>
  <text x="862" y="436" class="small" text-anchor="middle">routing from config, not from prose</text>

  <rect x="515" y="458" width="210" height="64" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="620" y="484" class="name" text-anchor="middle">Monitor</text>
  <text x="620" y="506" class="small" text-anchor="middle">state from files, never from memory</text>

  <rect x="273" y="388" width="210" height="64" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="378" y="414" class="name" text-anchor="middle">Review</text>
  <text x="378" y="436" class="small" text-anchor="middle">the diff against the brief, not itself</text>

  <rect x="273" y="188" width="210" height="64" rx="10" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="378" y="214" class="name" text-anchor="middle">Wrap up</text>
  <text x="378" y="236" class="small" text-anchor="middle">a measured receipt, then the lessons</text>

  <!-- next run -->
  <path d="M 273 210 H 190 V 150 H 515" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-slate)"/>
  <text x="196" y="172" class="small">what the next run starts from</text>

  <!-- escalation ladder -->
  <text x="40" y="572" class="head">WHO DECIDES, IN ORDER</text>
  <rect x="40" y="586" width="200" height="44" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="140" y="613" class="line" text-anchor="middle">a script, if it can</text>
  <line x1="240" y1="608" x2="262" y2="608" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow-slate)"/>
  <rect x="266" y="586" width="200" height="44" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="366" y="613" class="line" text-anchor="middle">a second model</text>
  <line x1="466" y1="608" x2="488" y2="608" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow-slate)"/>
  <rect x="492" y="586" width="200" height="44" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="592" y="613" class="line" text-anchor="middle">the driver</text>
  <line x1="692" y1="608" x2="714" y2="608" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow-slate)"/>
  <rect x="718" y="586" width="200" height="44" rx="10" fill="#fdf2f8" stroke="#be185d"/>
  <text x="818" y="613" class="line m" fill="#be185d" text-anchor="middle">arbiter</text>
  <line x1="918" y1="608" x2="940" y2="608" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow-slate)"/>
  <rect x="944" y="586" width="256" height="44" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="1072" y="613" class="line" text-anchor="middle">you — every hard stop, always</text>
</svg>
