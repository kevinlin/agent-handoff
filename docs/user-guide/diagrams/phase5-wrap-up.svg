<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1176">
  <style>
    text { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', ui-monospace, monospace; }
    .title { font-size: 18px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-size: 10.5px; fill: #64748b; }
    .phase { font-size: 11px; font-weight: 700; fill: #475569; letter-spacing: 0.08em; }
    .pill { font-size: 10px; font-weight: 700; }
    .ntitle { font-size: 11.5px; font-weight: 700; fill: #0f172a; }
    .note { font-size: 10px; fill: #475569; }
    .warn { font-size: 10px; fill: #be123c; }
    .ev { font-size: 10px; font-weight: 700; fill: #334155; }
    .back { font-size: 10px; font-weight: 700; fill: #64748b; }
    .leg { font-size: 10px; fill: #475569; }
    .fhead { font-size: 11px; font-weight: 700; fill: #0f172a; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e6ebf2" stroke-width="0.5"/>
    </pattern>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e11d48"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1200" height="1176" fill="#f8fafc"/>
  <rect width="1200" height="1176" fill="url(#grid)"/>
  <text x="92" y="40" class="title">Phase 5 — every reported field traced back to something that was read</text>
  <text x="92" y="62" class="subtitle">Evidence in, generated receipt out, re-validated, then what the next session inherits.</text>
  <text x="92" y="86" class="phase">PHASE 5 · WRAP UP</text>
  <rect x="92" y="104" width="11" height="11" rx="3" fill="#7c3aed" opacity="0.85"/>
  <text x="109" y="114" class="leg">Claude driver</text>
  <rect x="213.0" y="104" width="11" height="11" rx="3" fill="#2563eb" opacity="0.85"/>
  <text x="230.0" y="114" class="leg">probes</text>
  <rect x="292.0" y="104" width="11" height="11" rx="3" fill="#2563eb" opacity="0.85"/>
  <text x="309.0" y="114" class="leg">make-receipt.py</text>
  <rect x="425.0" y="104" width="11" height="11" rx="3" fill="#2563eb" opacity="0.85"/>
  <text x="442.0" y="114" class="leg">validate-receipt.py</text>
  <rect x="582.0" y="104" width="11" height="11" rx="3" fill="#475569" opacity="0.85"/>
  <text x="599.0" y="114" class="leg">.handoff/ on disk</text>
  <line x1="346" y1="246" x2="346" y2="285" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="596" y1="355" x2="641" y2="355" stroke="#e11d48" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <rect x="605" y="335" width="34" height="15" rx="4" fill="#f8fafc" opacity="0.95"/>
  <text x="622" y="346" class="ev" text-anchor="middle">gaps</text>
  <line x1="346" y1="418" x2="346" y2="457" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="358" y="445" class="ev">evidence-derived fields</text>
  <line x1="346" y1="575" x2="346" y2="614" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="358" y="602" class="ev">receipt written</text>
  <line x1="346" y1="717" x2="346" y2="756" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="358" y="744" class="ev">valid</text>
  <line x1="346" y1="874" x2="346" y2="913" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="96" y="150" width="500" height="96" rx="9" fill="#ffffff" stroke="#475569" stroke-width="1.4"/>
  <rect x="110" y="161" width="94" height="18" rx="6" fill="#7c3aed" opacity="0.10"/>
  <text x="118" y="174" class="pill" fill="#7c3aed">Claude driver</text>
  <text x="110" y="200" class="ntitle">Close the run</text>
  <text x="110" y="218" class="note">mark the tasks done in .handoff/goal.md</text>
  <text x="110" y="233" class="note">stop any /loop still ticking</text>
  <rect x="96" y="292" width="500" height="126" rx="9" fill="#ffffff" stroke="#475569" stroke-width="1.4"/>
  <rect x="110" y="303" width="52" height="18" rx="6" fill="#2563eb" opacity="0.10"/>
  <text x="118" y="316" class="pill" fill="#2563eb">probes</text>
  <text x="110" y="342" class="ntitle">Gather evidence, never recall it</text>
  <text x="110" y="360" class="note">each job's meta — role · model · effort + the source of each</text>
  <text x="110" y="375" class="note">handoff-config.py resolve — scope · config_source · verified</text>
  <text x="110" y="390" class="note">.handoff/session-start → duration, wall clock including waits</text>
  <text x="110" y="405" class="note">each job’s submitted_at + exit_code mtime → codex_job_durations</text>
  <rect x="648" y="292" width="500" height="126" rx="9" fill="#fff5f7" stroke="#e11d48" stroke-width="1.4"/>
  <rect x="662" y="303" width="52" height="18" rx="6" fill="#2563eb" opacity="0.10"/>
  <text x="670" y="316" class="pill" fill="#2563eb">probes</text>
  <text x="662" y="342" class="ntitle">What was not measured cannot be claimed</text>
  <text x="662" y="360" class="warn">no start marker and no explicit --started-at → the tool</text>
  <text x="662" y="375" class="warn">refuses to emit rather than take a remembered start time</text>
  <text x="662" y="390" class="note">a role with verified:false is still listed, with the flag as it</text>
  <text x="662" y="405" class="note">is — never dropped, never guessed true to look cleaner</text>
  <rect x="96" y="464" width="500" height="111" rx="9" fill="#ffffff" stroke="#475569" stroke-width="1.4"/>
  <rect x="110" y="475" width="106" height="18" rx="6" fill="#2563eb" opacity="0.10"/>
  <text x="118" y="488" class="pill" fill="#2563eb">make-receipt.py</text>
  <text x="110" y="514" class="ntitle">make-receipt.py --save</text>
  <text x="110" y="532" class="note">duration · codex_jobs · codex_job_durations · roles_used</text>
  <text x="110" y="547" class="note">schema v4; a v3 receipt fails, the signal to regenerate it</text>
  <text x="110" y="562" class="note">refuses to emit an invalid receipt at all</text>
  <rect x="96" y="621" width="500" height="96" rx="9" fill="#ffffff" stroke="#475569" stroke-width="1.4"/>
  <rect x="110" y="632" width="130" height="18" rx="6" fill="#2563eb" opacity="0.10"/>
  <text x="118" y="645" class="pill" fill="#2563eb">validate-receipt.py</text>
  <text x="110" y="671" class="ntitle">Re-check the written receipt</text>
  <text x="110" y="689" class="note">validate-receipt.py against docs/receipt-schema.json</text>
  <text x="110" y="704" class="note">the same check CI runs, run on the run's own output</text>
  <rect x="96" y="763" width="500" height="111" rx="9" fill="#ffffff" stroke="#475569" stroke-width="1.4"/>
  <rect x="110" y="774" width="94" height="18" rx="6" fill="#7c3aed" opacity="0.10"/>
  <text x="118" y="787" class="pill" fill="#7c3aed">Claude driver</text>
  <text x="110" y="813" class="ntitle">Memory protocol</text>
  <text x="110" y="831" class="note">law → CLAUDE.md and AGENTS.md, seen unconditionally</text>
  <text x="110" y="846" class="note">experience → what delegated well, rework rounds, effort fit</text>
  <text x="110" y="861" class="note">so the next split decision starts from evidence, not habit</text>
  <rect x="96" y="920" width="500" height="126" rx="9" fill="#ffffff" stroke="#475569" stroke-width="1.4"/>
  <rect x="110" y="931" width="118" height="18" rx="6" fill="#475569" opacity="0.10"/>
  <text x="118" y="944" class="pill" fill="#475569">.handoff/ on disk</text>
  <text x="110" y="970" class="ntitle">What the next session inherits</text>
  <text x="110" y="988" class="note">.handoff/goal.md — the final task statuses and notes</text>
  <text x="110" y="1003" class="note">.handoff/jobs/ — prompts, logs, session ids</text>
  <text x="110" y="1018" class="note">.handoff/receipts/ and .handoff/e2e/ — receipts and verdicts</text>
  <text x="110" y="1033" class="note">a resumed session reads these, not the repository</text>
  <rect x="92" y="1052" width="1056" height="84" rx="9" fill="#ffffff" stroke="#475569" stroke-width="1.4"/>
  <text x="110" y="1078" class="fhead">The closing rule</text>
  <text x="110" y="1098" class="note">Do not fabricate token savings. With no telemetry, report verifiable behavior instead: which tasks ran on the</text>
  <text x="110" y="1118" class="note">Codex subscription, how many jobs and fix rounds, that the full diff was reviewed against acceptance, checks passed.</text>
</svg>
