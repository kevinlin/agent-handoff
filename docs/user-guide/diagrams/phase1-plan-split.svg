<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1610">
  <style>
    text { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', ui-monospace, monospace; }
    .title { font-size: 21.6px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-size: 12.6px; fill: #64748b; }
    .phase { font-size: 13.2px; font-weight: 700; fill: #7c3aed; letter-spacing: 0.08em; }
    .pill { font-size: 12px; font-weight: 700; }
    .ntitle { font-size: 13.8px; font-weight: 700; fill: #0f172a; }
    .note { font-size: 12px; fill: #475569; }
    .warn { font-size: 12px; fill: #be123c; }
    .ev { font-size: 12px; font-weight: 700; fill: #334155; }
    .back { font-size: 12px; font-weight: 700; fill: #64748b; }
    .leg { font-size: 12px; fill: #475569; }
    .fhead { font-size: 13.2px; font-weight: 700; fill: #0f172a; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e6ebf2" stroke-width="0.5"/>
    </pattern>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e11d48"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1200" height="1610" fill="#f8fafc"/>
  <rect width="1200" height="1610" fill="url(#grid)"/>
  <text x="92" y="40" class="title">Phase 1 — the split is written down, then attacked, before anything is delegated</text>
  <text x="92" y="62" class="subtitle">Events run down the spine; guards and consequences branch right. No implementation has left the driver yet.</text>
  <text x="92" y="86" class="phase">PHASE 1 · PLAN &amp; SPLIT</text>
  <rect x="92" y="104" width="11" height="11" rx="3" fill="#0f172a" opacity="0.85"/>
  <text x="109" y="114" class="leg">User</text>
  <rect x="159.0" y="104" width="11" height="11" rx="3" fill="#7c3aed" opacity="0.85"/>
  <text x="176.0" y="114" class="leg">Claude driver</text>
  <rect x="280.0" y="104" width="11" height="11" rx="3" fill="#d97706" opacity="0.85"/>
  <text x="297.0" y="114" class="leg">goal-sync.py</text>
  <rect x="395.0" y="104" width="11" height="11" rx="3" fill="#e11d48" opacity="0.85"/>
  <text x="412.0" y="114" class="leg">adversarial gate</text>
  <rect x="530.0" y="104" width="11" height="11" rx="3" fill="#2563eb" opacity="0.85"/>
  <text x="547.0" y="114" class="leg">deep_reasoner</text>
  <line x1="346" y1="231" x2="346" y2="270" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="358" y="258" class="ev">handoff requested</text>
  <line x1="346" y1="403" x2="346" y2="427" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="358" y="415" class="ev">repo grounded</text>
  <path d="M 596 497 H 622 V 490 H 641" fill="none" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <line x1="346" y1="560" x2="346" y2="599" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="358" y="587" class="ev">rows drafted</text>
  <line x1="346" y1="687" x2="346" y2="726" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="358" y="714" class="ev">bytes + hash</text>
  <line x1="346" y1="844" x2="346" y2="883" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M 596 930 H 622 V 946 H 641" fill="none" stroke="#e11d48" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <rect x="589.2" y="909" width="65.6" height="18" rx="4" fill="#f8fafc" opacity="0.95"/>
  <text x="622" y="922" class="ev" text-anchor="middle">conflict</text>
  <line x1="346" y1="971" x2="346" y2="1040" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="358" y="1013" class="ev">the split, verbatim</text>
  <line x1="596" y1="1102" x2="641" y2="1102" stroke="#e11d48" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <rect x="592.8" y="1081" width="58.4" height="18" rx="4" fill="#f8fafc" opacity="0.95"/>
  <text x="622" y="1094" class="ev" text-anchor="middle">answers</text>
  <path d="M 898 1158 V 1181 H 52 V 788 H 89" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#ag)"/>
  <text x="46" y="946" class="back" text-anchor="middle" transform="rotate(-90 46 946)">fix the split, gate again</text>
  <line x1="346" y1="1158" x2="346" y2="1197" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="354" y="1173" width="137.6" height="18" rx="4" fill="#f8fafc" opacity="0.95"/>
  <text x="358" y="1185" class="ev">the split survives</text>
  <rect x="96" y="150" width="500" height="81" rx="9" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4"/>
  <rect x="110" y="161" width="44.8" height="18" rx="6" fill="#0f172a" opacity="0.10"/>
  <text x="118" y="174" class="pill" fill="#0f172a">User</text>
  <text x="110" y="200" class="ntitle">"delegate to codex"</text>
  <text x="110" y="218" class="note">the request that starts the flow</text>
  <rect x="96" y="277" width="500" height="126" rx="9" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4"/>
  <rect x="110" y="288" width="109.6" height="18" rx="6" fill="#7c3aed" opacity="0.10"/>
  <text x="118" y="301" class="pill" fill="#7c3aed">Claude driver</text>
  <text x="110" y="327" class="ntitle">Preflight</text>
  <text x="110" y="345" class="note">codex/claude --version — a missing CLI stops the flow</text>
  <text x="110" y="360" class="note">AGENTS.md: DO NOT send optional commentary</text>
  <text x="110" y="375" class="note">git status --short → note pre-existing dirt</text>
  <text x="110" y="390" class="note">make-receipt.py --start → .handoff/session-start</text>
  <rect x="96" y="434" width="500" height="126" rx="9" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4"/>
  <rect x="110" y="445" width="109.6" height="18" rx="6" fill="#7c3aed" opacity="0.10"/>
  <text x="118" y="458" class="pill" fill="#7c3aed">Claude driver</text>
  <text x="110" y="484" class="ntitle">Refine into a plan, one judgment per row</text>
  <text x="110" y="502" class="note">which capability does this work actually need?</text>
  <text x="110" y="517" class="note">fast_worker — mechanical, spec-complete</text>
  <text x="110" y="532" class="note">deep_reasoner — ambiguous, costly if the premise is wrong</text>
  <text x="110" y="547" class="note">identity - — architecture, integration, final acceptance</text>
  <rect x="648" y="434" width="500" height="111" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="662" y="445" width="109.6" height="18" rx="6" fill="#7c3aed" opacity="0.10"/>
  <text x="670" y="458" class="pill" fill="#7c3aed">Claude driver</text>
  <text x="662" y="484" class="ntitle">Escape hatches, for edge cases only</text>
  <text x="662" y="502" class="note">one-shot Codex subagent for a stuck step, no durable state</text>
  <text x="662" y="517" class="note">raw Task subagent when no Handoff identity fits</text>
  <text x="662" y="532" class="note">the identity's backend picks the CLI and the meter, not you</text>
  <path d="M 596 790 H 622 V 796 H 641" fill="none" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <rect x="648" y="733" width="500" height="126" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="662" y="744" width="109.6" height="18" rx="6" fill="#7c3aed" opacity="0.10"/>
  <text x="670" y="757" class="pill" fill="#7c3aed">Claude driver</text>
  <text x="662" y="783" class="ntitle">Acceptance coverage, when the change is user-visible</text>
  <text x="662" y="801" class="note">behaviour changes at a real interface → add e2e_specifier</text>
  <text x="662" y="816" class="note">and e2e_verifier rows, with depends wired to both makers</text>
  <text x="662" y="831" class="note">skip it for refactors, docs, config, pure library work</text>
  <text x="662" y="846" class="note">criterion fires but unconfigured → name --with-e2e, continue</text>
  <rect x="96" y="606" width="500" height="81" rx="9" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4"/>
  <rect x="110" y="617" width="102.4" height="18" rx="6" fill="#d97706" opacity="0.10"/>
  <text x="118" y="630" class="pill" fill="#d97706">goal-sync.py</text>
  <text x="110" y="656" class="ntitle">read the current goal file</text>
  <text x="110" y="674" class="note">returns bytes + the sha256 to state on the next write</text>
  <rect x="96" y="733" width="500" height="111" rx="9" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4"/>
  <rect x="110" y="744" width="109.6" height="18" rx="6" fill="#7c3aed" opacity="0.10"/>
  <text x="118" y="757" class="pill" fill="#7c3aed">Claude driver</text>
  <text x="110" y="783" class="ntitle">Compose .handoff/goal.md</text>
  <text x="110" y="801" class="note">one why-forward goal line ending in done_when</text>
  <text x="110" y="816" class="note">checkpoint rule + task table: identity · acceptance · depends</text>
  <text x="110" y="831" class="note">acceptance is a command or an observable, not a vibe</text>
  <rect x="96" y="890" width="500" height="81" rx="9" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4"/>
  <rect x="110" y="901" width="102.4" height="18" rx="6" fill="#d97706" opacity="0.10"/>
  <text x="118" y="914" class="pill" fill="#d97706">goal-sync.py</text>
  <text x="110" y="940" class="ntitle">write --expect-sha256 &lt;hash&gt;</text>
  <text x="110" y="958" class="note">atomic replace, so a partial file is never observable</text>
  <rect x="648" y="890" width="500" height="111" rx="9" fill="#fff5f7" stroke="#e11d48" stroke-width="1.4"/>
  <rect x="662" y="901" width="102.4" height="18" rx="6" fill="#d97706" opacity="0.10"/>
  <text x="670" y="914" class="pill" fill="#d97706">goal-sync.py</text>
  <text x="662" y="940" class="ntitle">Refused rather than clobbered</text>
  <text x="662" y="958" class="warn">hash mismatch → abort: re-read and retry</text>
  <text x="662" y="973" class="warn">no hash stated + file exists → refuse to overwrite</text>
  <text x="662" y="988" class="note">compare-and-set beats a lock nobody would release correctly</text>
  <rect x="96" y="1047" width="500" height="111" rx="9" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4"/>
  <rect x="110" y="1058" width="131.2" height="18" rx="6" fill="#e11d48" opacity="0.10"/>
  <text x="118" y="1071" class="pill" fill="#e11d48">adversarial gate</text>
  <text x="110" y="1097" class="ntitle">Adversarial gate on the split</text>
  <text x="110" y="1115" class="note">is the cheap tier really enough for each delegated row?</text>
  <text x="110" y="1130" class="note">does the integration cost of the boundary eat the saving?</text>
  <text x="110" y="1145" class="note">does each identity match the work's actual stakes?</text>
  <rect x="648" y="1047" width="500" height="111" rx="9" fill="#fff5f7" stroke="#e11d48" stroke-width="1.4"/>
  <rect x="662" y="1058" width="131.2" height="18" rx="6" fill="#e11d48" opacity="0.10"/>
  <text x="670" y="1071" class="pill" fill="#e11d48">adversarial gate</text>
  <text x="662" y="1097" class="ntitle">A row that fails any question</text>
  <text x="662" y="1115" class="warn">its identity gets corrected, or it merges into a neighbour,</text>
  <text x="662" y="1130" class="warn">or the driver keeps it inline — fix the split, then delegate</text>
  <text x="662" y="1145" class="note">answered in writing, but nothing blocks a submit that skipped it</text>
  <rect x="96" y="1204" width="500" height="126" rx="9" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4"/>
  <rect x="110" y="1215" width="109.6" height="18" rx="6" fill="#2563eb" opacity="0.10"/>
  <text x="118" y="1228" class="pill" fill="#2563eb">deep_reasoner</text>
  <text x="110" y="1254" class="ntitle">Spec review — optional, and only here</text>
  <text x="110" y="1272" class="note">auto_review_spec on, or the user asks for a second reader</text>
  <text x="110" y="1287" class="note">the plan goes in the packet verbatim; the job is --read-only</text>
  <text x="110" y="1302" class="note">findings come back; the driver folds in what holds</text>
  <text x="110" y="1317" class="note">goal.md ## Spec Review records it — nothing repeats it</text>
  <path d="M 596 1250 H 622 V 1256 H 641" fill="none" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <rect x="648" y="1204" width="500" height="126" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="662" y="1215" width="109.6" height="18" rx="6" fill="#2563eb" opacity="0.10"/>
  <text x="670" y="1228" class="pill" fill="#2563eb">deep_reasoner</text>
  <text x="662" y="1254" class="ntitle">Read, not solved again — and not blind</text>
  <text x="662" y="1272" class="note">the plan under review is the driver's own answer, so nothing</text>
  <text x="662" y="1287" class="note">is withheld; the arbiter's contamination rule is a different tool</text>
  <text x="662" y="1302" class="note">read-only: no edit to the plan, the goal file, or the repo</text>
  <text x="662" y="1317" class="note">same vendor as the driver → say so, do not claim independence</text>
  <line x1="346" y1="1330" x2="346" y2="1369" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="354" y="1345" width="110" height="18" rx="4" fill="#f8fafc" opacity="0.95"/>
  <text x="358" y="1357" class="ev">plan adjusted</text>
  <rect x="96" y="1376" width="500" height="96" rx="9" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4"/>
  <rect x="110" y="1387" width="109.6" height="18" rx="6" fill="#7c3aed" opacity="0.10"/>
  <text x="118" y="1400" class="pill" fill="#7c3aed">Claude driver</text>
  <text x="110" y="1426" class="ntitle">Ready to delegate</text>
  <text x="110" y="1444" class="note">rows hold id · identity · task · acceptance · depends · status</text>
  <text x="110" y="1459" class="note">jobId still empty — no implementation has left the driver</text>
  <rect x="92" y="1490" width="1056" height="84" rx="9" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="110" y="1516" class="fhead">Why this order</text>
  <text x="110" y="1536" class="note">Acceptance criteria are authorable only before the diff exists — a criterion written after seeing the change is a</text>
  <text x="110" y="1556" class="note">description, not a test. So the goal file is written first, the gate attacks the plan, and the outside read comes last.</text>
</svg>
