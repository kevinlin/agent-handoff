<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1110">
  <style>
    text { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', ui-monospace, monospace; }
    .title { font-size: 21.6px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-size: 12.6px; fill: #64748b; }
    .bandnum { font-size: 26.4px; font-weight: 700; }
    .bandname { font-size: 14.4px; font-weight: 700; fill: #0f172a; }
    .bandsub { font-size: 12px; fill: #64748b; }
    .cardtitle { font-size: 13.8px; font-weight: 700; fill: #0f172a; }
    .line { font-size: 12px; fill: #475569; }
    .warn { font-size: 12px; fill: #be123c; }
    .cardhead { font-size: 14.4px; font-weight: 700; fill: #0f172a; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e6ebf2" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="1110" fill="#f8fafc"/>
  <rect width="1200" height="1110" fill="url(#grid)"/>

  <text x="40" y="42" class="title">The Handoff flow, phase by phase</text>
  <text x="40" y="64" class="subtitle">One flow: Claude Code plans and splits the work, attacks its own split, runs the delegated work as background jobs, and full-reviews before accepting</text>

  <!-- BAND 1 -->
  <rect x="50" y="100" width="1130" height="160" rx="10" fill="rgba(139,92,246,0.06)" stroke="#c4b5fd" stroke-width="1"/>
  <text x="70" y="146" class="bandnum" fill="#7c3aed">1</text>
  <text x="70" y="170" class="bandname">PLAN &amp; SPLIT</text>
  <text x="70" y="190" class="bandsub">driver only —</text>
  <text x="70" y="206" class="bandsub">no implementation</text>
  <text x="70" y="222" class="bandsub">delegated yet</text>

  <rect x="200" y="116" width="318" height="128" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="217" y="142" class="cardtitle">Write .handoff/goal.md</text>
  <text x="217" y="164" class="line">one why-forward goal + checkpoint rule</text>
  <text x="217" y="181" class="line">task table: identity, acceptance, deps</text>
  <text x="217" y="198" class="line">goal-sync.py write --expect-sha256</text>
  <text x="217" y="215" class="line">so a concurrent write is never lost</text>
  <text x="217" y="232" class="line">## Spec Review — once-per-run marker</text>

  <rect x="530" y="116" width="318" height="128" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="547" y="142" class="cardtitle">Split by capability, one per row</text>
  <text x="547" y="164" class="line">fast_worker — mechanical, spec-complete</text>
  <text x="547" y="181" class="line">deep_reasoner — ambiguous, high stakes</text>
  <text x="547" y="198" class="line">identity "-" — the driver keeps it</text>
  <text x="547" y="215" class="line">the identity picks the CLI and meter</text>
  <text x="547" y="232" class="line">deep_reasoner can also review the plan</text>

  <rect x="860" y="116" width="318" height="128" rx="8" fill="#ffffff" stroke="#e11d48" stroke-width="1.4"/>
  <text x="877" y="142" class="cardtitle">Adversarial gate on your own split</text>
  <text x="877" y="164" class="line">is the cheap tier really enough here?</text>
  <text x="877" y="181" class="line">does the split boundary eat the saving?</text>
  <text x="877" y="198" class="line">does each identity match the stakes?</text>
  <text x="877" y="215" class="warn">fix the split before delegating</text>
  <text x="877" y="232" class="line">optional: deep_reasoner reads it once</text>

  <polygon points="120,264 132,264 126,274" fill="#94a3b8"/>

  <!-- BAND 2 -->
  <rect x="50" y="278" width="1130" height="140" rx="10" fill="rgba(245,158,11,0.07)" stroke="#fcd34d" stroke-width="1"/>
  <text x="70" y="324" class="bandnum" fill="#d97706">2</text>
  <text x="70" y="348" class="bandname">DELEGATE</text>
  <text x="70" y="368" class="bandsub">work leaves the</text>
  <text x="70" y="384" class="bandsub">driver's context</text>
  <text x="70" y="400" class="bandsub">here</text>

  <rect x="200" y="294" width="318" height="108" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.4"/>
  <text x="217" y="320" class="cardtitle">Build the delegation packet</text>
  <text x="217" y="342" class="line">why-forward context · one-sentence task</text>
  <text x="217" y="359" class="line">acceptance written as commands</text>
  <text x="217" y="376" class="line">only genuine scope constraints</text>
  <text x="217" y="393" class="line">no commentary · ≤ 3 lines of lessons</text>

  <rect x="530" y="294" width="318" height="108" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.4"/>
  <text x="547" y="320" class="cardtitle">Resolve the identity</text>
  <text x="547" y="342" class="line">handoff-config.py resolve →</text>
  <text x="547" y="359" class="line">backend · model · effort — config only</text>
  <text x="547" y="376" class="warn">no config → hard error, no default</text>
  <text x="547" y="393" class="line">backend picks the CLI: codex or claude</text>

  <rect x="860" y="294" width="318" height="108" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.4"/>
  <text x="877" y="320" class="cardtitle">Submit a background job</text>
  <text x="877" y="342" class="line">delegate-codex.sh submit --role ...</text>
  <text x="877" y="359" class="line">nohup the worker CLI, stdin closed</text>
  <text x="877" y="376" class="line">--read-only scans, --worktree for e2e</text>
  <text x="877" y="393" class="line">jobId goes back into the goal.md row</text>

  <polygon points="120,422 132,422 126,432" fill="#94a3b8"/>

  <!-- BAND 3 -->
  <rect x="50" y="436" width="1130" height="140" rx="10" fill="rgba(37,99,235,0.06)" stroke="#93c5fd" stroke-width="1"/>
  <text x="70" y="482" class="bandnum" fill="#2563eb">3</text>
  <text x="70" y="506" class="bandname">MONITOR</text>
  <text x="70" y="526" class="bandsub">state is read</text>
  <text x="70" y="542" class="bandsub">from disk, not</text>
  <text x="70" y="558" class="bandsub">held in context</text>

  <rect x="200" y="452" width="318" height="108" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="217" y="478" class="cardtitle">Short single job</text>
  <text x="217" y="500" class="line">status &lt;jobId&gt; --wait --timeout 300</text>
  <text x="217" y="517" class="line">blocks until DONE or the timeout</text>
  <text x="217" y="534" class="line">non-zero exit only on timeout/failure</text>
  <text x="217" y="551" class="line">the printed state: line is the signal</text>

  <rect x="530" y="452" width="318" height="108" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="547" y="478" class="cardtitle">Long or parallel jobs</text>
  <text x="547" y="500" class="line">/loop tick every 5 minutes</text>
  <text x="547" y="517" class="line">read goal.md, status each running job</text>
  <text x="547" y="534" class="line">tail log.jsonl for the last event</text>
  <text x="547" y="551" class="line">stop the loop when none is RUNNING</text>

  <rect x="860" y="452" width="318" height="108" rx="8" fill="#ffffff" stroke="#e11d48" stroke-width="1.4"/>
  <text x="877" y="478" class="cardtitle">Anomaly rule</text>
  <text x="877" y="500" class="line">two ticks with no new event, or FAILED</text>
  <text x="877" y="517" class="line">cancel the job, read stderr.log</text>
  <text x="877" y="534" class="line">resubmit corrected, or take it back</text>
  <text x="877" y="551" class="warn">record the anomaly in the receipt</text>

  <polygon points="120,580 132,580 126,590" fill="#94a3b8"/>

  <!-- BAND 4 -->
  <rect x="50" y="594" width="1130" height="140" rx="10" fill="rgba(16,185,129,0.06)" stroke="#6ee7b7" stroke-width="1"/>
  <text x="70" y="640" class="bandnum" fill="#059669">4</text>
  <text x="70" y="664" class="bandname">REVIEW GATE</text>
  <text x="70" y="684" class="bandsub">the phase that</text>
  <text x="70" y="700" class="bandsub">makes the cost</text>
  <text x="70" y="716" class="bandsub">claim honest</text>

  <rect x="200" y="610" width="318" height="108" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.4"/>
  <text x="217" y="636" class="cardtitle">Collect the result</text>
  <text x="217" y="658" class="line">result &lt;jobId&gt; reduces log.jsonl to</text>
  <text x="217" y="675" class="line">session_id · last agent message</text>
  <text x="217" y="692" class="line">commands run · token usage</text>
  <text x="217" y="709" class="line">the full stream stays on disk</text>

  <rect x="530" y="610" width="318" height="108" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.4"/>
  <text x="547" y="636" class="cardtitle">Review against the brief</text>
  <text x="547" y="658" class="line">read the whole diff, never a sample</text>
  <text x="547" y="675" class="line">judge it against goal.md acceptance</text>
  <text x="547" y="692" class="line">plus the fastest relevant check</text>
  <text x="547" y="709" class="warn">diff-only review redefines the spec</text>

  <rect x="860" y="610" width="318" height="108" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.4"/>
  <text x="877" y="636" class="cardtitle">Fix rounds</text>
  <text x="877" y="658" class="line">resume &lt;jobId&gt; on the same session</text>
  <text x="877" y="675" class="line">send findings + failed criteria only</text>
  <text x="877" y="692" class="line">max 2 rounds, then take the task back</text>
  <text x="877" y="709" class="line">takeback noted in goal.md and receipt</text>

  <polygon points="120,738 132,738 126,748" fill="#94a3b8"/>

  <!-- BAND 5 -->
  <rect x="50" y="752" width="1130" height="140" rx="10" fill="rgba(100,116,139,0.07)" stroke="#cbd5e1" stroke-width="1"/>
  <text x="70" y="798" class="bandnum" fill="#475569">5</text>
  <text x="70" y="822" class="bandname">WRAP UP</text>
  <text x="70" y="842" class="bandsub">what the next</text>
  <text x="70" y="858" class="bandsub">session inherits</text>

  <rect x="200" y="768" width="318" height="108" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="217" y="794" class="cardtitle">Handoff session receipt</text>
  <text x="217" y="816" class="line">make-receipt.py refuses invalid output</text>
  <text x="217" y="833" class="line">duration · codex_jobs + cc_jobs, split</text>
  <text x="217" y="850" class="line">roles_used carries verified as it is,</text>
  <text x="217" y="867" class="line">never guessed true to look cleaner</text>

  <rect x="530" y="768" width="318" height="108" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="547" y="794" class="cardtitle">Memory protocol</text>
  <text x="547" y="816" class="line">what was delegated versus kept, and why</text>
  <text x="547" y="833" class="line">rework rounds per task type</text>
  <text x="547" y="850" class="line">whether the effort level fitted</text>
  <text x="547" y="867" class="line">so the next split starts smarter</text>

  <rect x="860" y="768" width="318" height="108" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="877" y="794" class="cardtitle">State left on disk</text>
  <text x="877" y="816" class="line">.handoff/goal.md — final task statuses</text>
  <text x="877" y="833" class="line">.handoff/jobs/ — prompts, logs, ids</text>
  <text x="877" y="850" class="line">.handoff/receipts/ · .handoff/e2e/</text>
  <text x="877" y="867" class="line">on resume these are read, not the repo</text>

  <!-- bottom cards -->
  <rect x="50" y="920" width="555" height="160" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.4"/>
  <text x="70" y="948" class="cardhead">.handoff/jobs/&lt;jobId&gt;/ — the durable handoff surface</text>
  <text x="70" y="972" class="line">prompt.md — exactly what was asked, kept as the audit record</text>
  <text x="70" y="992" class="line">run.sh — the command actually executed, sandbox and effort included</text>
  <text x="70" y="1012" class="line">log.jsonl · stderr.log — the event stream and the first place to look</text>
  <text x="70" y="1032" class="line">pid · exit_code · cancelled — the three inputs to the job state</text>
  <text x="70" y="1052" class="line">session_id — the handle that makes a fix round a resume, not a restart</text>
  <text x="70" y="1072" class="line">meta — role, backend, model, effort, and where each value came from</text>

  <rect x="625" y="920" width="555" height="160" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="645" y="948" class="cardhead">Arbiter protocol — the blind second solve</text>
  <text x="645" y="972" class="line">For contentious calls the same problem goes, verbatim, to both</text>
  <text x="645" y="992" class="line">deep_reasoner and arbiter, each on its own configured backend.</text>
  <text x="645" y="1012" class="line">Neither packet may carry the other's answer or a leaning hint;</text>
  <text x="645" y="1032" class="line">a contaminated run is rerun, not patched.</text>
  <text x="645" y="1052" class="line">Agreement is adopted as dual-verified. Disagreement is ruled on by</text>
  <text x="645" y="1072" class="line">the driver, with the point of divergence written into the report.</text>
</svg>
