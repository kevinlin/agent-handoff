<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 580">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0f172a; }
    .m { font-family: "SF Mono", Menlo, Consolas, ui-monospace, monospace; }
    .title { font-size: 22px; font-weight: 700; }
    .sub { font-size: 14px; fill: #64748b; }
    .name { font-size: 15px; font-weight: 700; }
    .line { font-size: 13px; fill: #475569; }
    .small { font-size: 12px; fill: #64748b; }
    .pkt { font-size: 12px; font-weight: 700; fill: #b45309; }
    .head { font-size: 12px; font-weight: 700; fill: #64748b; letter-spacing: 0.06em; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e6ebf2" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <!-- CLI marks, copied from assets/setup-ui.html: Claude, GitHub Copilot and Cursor from simple-icons (CC0), Codex and Antigravity from lobe-icons (MIT) -->
    <symbol id="ic-claude" viewBox="0 0 24 24"><path fill-rule="evenodd" fill="#D97757" d="m4.7144 15.9555 4.7174-2.6471.079-.2307-.079-.1275h-.2307l-.7893-.0486-2.6956-.0729-2.3375-.0971-2.2646-.1214-.5707-.1215-.5343-.7042.0546-.3522.4797-.3218.686.0608 1.5179.1032 2.2767.1578 1.6514.0972 2.4468.255h.3886l.0546-.1579-.1336-.0971-.1032-.0972L6.973 9.8356l-2.55-1.6879-1.3356-.9714-.7225-.4918-.3643-.4614-.1578-1.0078.6557-.7225.8803.0607.2246.0607.8925.686 1.9064 1.4754 2.4893 1.8336.3643.3035.1457-.1032.0182-.0728-.164-.2733-1.3539-2.4467-1.445-2.4893-.6435-1.032-.17-.6194c-.0607-.255-.1032-.4674-.1032-.7285L6.287.1335 6.6997 0l.9957.1336.419.3642.6192 1.4147 1.0018 2.2282 1.5543 3.0296.4553.8985.2429.8318.091.255h.1579v-.1457l.1275-1.706.2368-2.0947.2307-2.6957.0789-.7589.3764-.9107.7468-.4918.5828.2793.4797.686-.0668.4433-.2853 1.8517-.5586 2.9021-.3643 1.9429h.2125l.2429-.2429.9835-1.3053 1.6514-2.0643.7286-.8196.85-.9046.5464-.4311h1.0321l.759 1.1293-.34 1.1657-1.0625 1.3478-.8804 1.1414-1.2628 1.7-.7893 1.36.0729.1093.1882-.0183 2.8535-.607 1.5421-.2794 1.8396-.3157.8318.3886.091.3946-.3278.8075-1.967.4857-2.3072.4614-3.4364.8136-.0425.0304.0486.0607 1.5482.1457.6618.0364h1.621l3.0175.2247.7892.522.4736.6376-.079.4857-1.2142.6193-1.6393-.3886-3.825-.9107-1.3113-.3279h-.1822v.1093l1.0929 1.0686 2.0035 1.8092 2.5075 2.3314.1275.5768-.3218.4554-.34-.0486-2.2039-1.6575-.85-.7468-1.9246-1.621h-.1275v.17l.4432.6496 2.3436 3.5214.1214 1.0807-.17.3521-.6071.2125-.6679-.1214-1.3721-1.9246L14.38 17.959l-1.1414-1.9428-.1397.079-.674 7.2552-.3156.3703-.7286.2793-.6071-.4614-.3218-.7468.3218-1.4753.3886-1.9246.3157-1.53.2853-1.9004.17-.6314-.0121-.0425-.1397.0182-1.4328 1.9672-2.1796 2.9446-1.7243 1.8456-.4128.164-.7164-.3704.0667-.6618.4008-.5889 2.386-3.0357 1.4389-1.882.929-1.0868-.0062-.1579h-.0546l-6.3385 4.1164-1.1293.1457-.4857-.4554.0608-.7467.2307-.2429 1.9064-1.3114Z"/></symbol>
  </defs>

  <rect width="1240" height="580" fill="#f8fafc"/>
  <rect width="1240" height="580" fill="url(#grid)"/>

  <text x="40" y="44" class="title">Every crossing is a packet with a named shape</text>
  <text x="40" y="68" class="sub">The driver writes each one by hand. None of them is "here is the repository, work it out".</text>

  <!-- spokes -->
  <line x1="500" y1="300" x2="278" y2="300" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 540 250 C 500 210, 460 196, 424 194" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 700 250 C 740 210, 780 196, 816 194" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="740" y1="300" x2="962" y2="300" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 700 350 C 740 390, 780 404, 816 406" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <text x="389" y="290" class="pkt" text-anchor="middle">delegation packet</text>
  <text x="478" y="234" class="pkt" text-anchor="middle">goal packet</text>
  <text x="762" y="234" class="pkt" text-anchor="middle">spec review packet</text>
  <text x="851" y="290" class="pkt">arbitration packet</text>
  <text x="762" y="372" class="pkt" text-anchor="middle">e2e packets</text>

  <!-- driver -->
  <rect x="500" y="250" width="240" height="100" rx="12" fill="#fdf2ee" stroke="#D97757" stroke-width="1.8"/>
  <use href="#ic-claude" x="562" y="273" width="20" height="20"/>
  <text x="588" y="290" class="name" style="fill:#b4532f">Claude Code</text>
  <text x="620" y="314" class="line" text-anchor="middle">writes every packet itself,</text>
  <text x="620" y="334" class="line" text-anchor="middle">out of what it already read</text>

  <!-- worker -->
  <rect x="40" y="258" width="238" height="84" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="60" y="288" class="name">the worker</text>
  <text x="60" y="312" class="small">why it matters, the one task, the</text>
  <text x="60" y="330" class="small">acceptance, what is out of scope</text>

  <!-- you -->
  <rect x="194" y="110" width="238" height="84" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="214" y="140" class="name">you</text>
  <text x="214" y="164" class="small">the plan with its evidence, the open</text>
  <text x="214" y="182" class="small">decisions, and what a yes authorizes</text>

  <!-- deep_reasoner -->
  <rect x="816" y="110" width="238" height="84" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="836" y="140" class="name m" style="fill:#4f46e5">deep_reasoner</text>
  <text x="836" y="164" class="small">the plan, verbatim — and no</text>
  <text x="836" y="182" class="small">permission to change anything</text>

  <!-- arbiter -->
  <rect x="962" y="258" width="238" height="84" rx="10" fill="#ffffff" stroke="#be185d" stroke-width="1.5"/>
  <text x="982" y="288" class="name m" style="fill:#be185d">arbiter</text>
  <text x="982" y="312" class="small">both sides of the argument and</text>
  <text x="982" y="330" class="small">the evidence, nothing withheld</text>

  <!-- e2e -->
  <rect x="816" y="396" width="238" height="84" rx="10" fill="#ffffff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="836" y="426" class="name m" style="fill:#0e7490">the e2e pair</text>
  <text x="836" y="450" class="small">the spec inline, a named test</text>
  <text x="836" y="468" class="small">target, and a branch of its own</text>

  <!-- shared shape -->
  <text x="40" y="516" class="head">WHAT EVERY PACKET CARRIES</text>
  <rect x="278" y="498" width="176" height="34" rx="17" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="366" y="520" class="small" text-anchor="middle">why the work matters</text>
  <rect x="466" y="498" width="176" height="34" rx="17" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="554" y="520" class="small" text-anchor="middle">one clear task</text>
  <rect x="654" y="498" width="176" height="34" rx="17" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="742" y="520" class="small" text-anchor="middle">acceptance you can run</text>
  <rect x="842" y="498" width="176" height="34" rx="17" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="930" y="520" class="small" text-anchor="middle">where it may not go</text>
  <rect x="1030" y="498" width="176" height="34" rx="17" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="1118" y="520" class="small" text-anchor="middle">a reply without filler</text>
</svg>
