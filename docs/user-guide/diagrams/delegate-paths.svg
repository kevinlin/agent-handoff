<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 560">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0f172a; }
    .m { font-family: "SF Mono", Menlo, Consolas, ui-monospace, monospace; }
    .title { font-size: 22px; font-weight: 700; }
    .sub { font-size: 14px; fill: #64748b; }
    .name { font-size: 15px; font-weight: 700; }
    .line { font-size: 13px; fill: #475569; }
    .small { font-size: 12px; fill: #64748b; }
    .head { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; }
    .rose { font-size: 12px; font-weight: 600; fill: #be123c; }
    .tag { font-size: 12px; font-weight: 600; fill: #475569; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e6ebf2" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <!-- CLI marks, copied from assets/setup-ui.html: Claude, GitHub Copilot and Cursor from simple-icons (CC0), Codex and Antigravity from lobe-icons (MIT) -->
    <symbol id="ic-codex" viewBox="0 0 24 24"><path fill-rule="evenodd" fill="#0f172a" d="M8.086.457a6.105 6.105 0 013.046-.415c1.333.153 2.521.72 3.564 1.7a.117.117 0 00.107.029c1.408-.346 2.762-.224 4.061.366l.063.03.154.076c1.357.703 2.33 1.77 2.918 3.198.278.679.418 1.388.421 2.126a5.655 5.655 0 01-.18 1.631.167.167 0 00.04.155 5.982 5.982 0 011.578 2.891c.385 1.901-.01 3.615-1.183 5.14l-.182.22a6.063 6.063 0 01-2.934 1.851.162.162 0 00-.108.102c-.255.736-.511 1.364-.987 1.992-1.199 1.582-2.962 2.462-4.948 2.451-1.583-.008-2.986-.587-4.21-1.736a.145.145 0 00-.14-.032c-.518.167-1.04.191-1.604.185a5.924 5.924 0 01-2.595-.622 6.058 6.058 0 01-2.146-1.781c-.203-.269-.404-.522-.551-.821a7.74 7.74 0 01-.495-1.283 6.11 6.11 0 01-.017-3.064.166.166 0 00.008-.074.115.115 0 00-.037-.064 5.958 5.958 0 01-1.38-2.202 5.196 5.196 0 01-.333-1.589 6.915 6.915 0 01.188-2.132c.45-1.484 1.309-2.648 2.577-3.493.282-.188.55-.334.802-.438.286-.12.573-.22.861-.304a.129.129 0 00.087-.087A6.016 6.016 0 015.635 2.31C6.315 1.464 7.132.846 8.086.457zm-.804 7.85a.848.848 0 00-1.473.842l1.694 2.965-1.688 2.848a.849.849 0 001.46.864l1.94-3.272a.849.849 0 00.007-.854l-1.94-3.393zm5.446 6.24a.849.849 0 000 1.695h4.848a.849.849 0 000-1.696h-4.848z"/></symbol>
    <symbol id="ic-claude" viewBox="0 0 24 24"><path fill-rule="evenodd" fill="#D97757" d="m4.7144 15.9555 4.7174-2.6471.079-.2307-.079-.1275h-.2307l-.7893-.0486-2.6956-.0729-2.3375-.0971-2.2646-.1214-.5707-.1215-.5343-.7042.0546-.3522.4797-.3218.686.0608 1.5179.1032 2.2767.1578 1.6514.0972 2.4468.255h.3886l.0546-.1579-.1336-.0971-.1032-.0972L6.973 9.8356l-2.55-1.6879-1.3356-.9714-.7225-.4918-.3643-.4614-.1578-1.0078.6557-.7225.8803.0607.2246.0607.8925.686 1.9064 1.4754 2.4893 1.8336.3643.3035.1457-.1032.0182-.0728-.164-.2733-1.3539-2.4467-1.445-2.4893-.6435-1.032-.17-.6194c-.0607-.255-.1032-.4674-.1032-.7285L6.287.1335 6.6997 0l.9957.1336.419.3642.6192 1.4147 1.0018 2.2282 1.5543 3.0296.4553.8985.2429.8318.091.255h.1579v-.1457l.1275-1.706.2368-2.0947.2307-2.6957.0789-.7589.3764-.9107.7468-.4918.5828.2793.4797.686-.0668.4433-.2853 1.8517-.5586 2.9021-.3643 1.9429h.2125l.2429-.2429.9835-1.3053 1.6514-2.0643.7286-.8196.85-.9046.5464-.4311h1.0321l.759 1.1293-.34 1.1657-1.0625 1.3478-.8804 1.1414-1.2628 1.7-.7893 1.36.0729.1093.1882-.0183 2.8535-.607 1.5421-.2794 1.8396-.3157.8318.3886.091.3946-.3278.8075-1.967.4857-2.3072.4614-3.4364.8136-.0425.0304.0486.0607 1.5482.1457.6618.0364h1.621l3.0175.2247.7892.522.4736.6376-.079.4857-1.2142.6193-1.6393-.3886-3.825-.9107-1.3113-.3279h-.1822v.1093l1.0929 1.0686 2.0035 1.8092 2.5075 2.3314.1275.5768-.3218.4554-.34-.0486-2.2039-1.6575-.85-.7468-1.9246-1.621h-.1275v.17l.4432.6496 2.3436 3.5214.1214 1.0807-.17.3521-.6071.2125-.6679-.1214-1.3721-1.9246L14.38 17.959l-1.1414-1.9428-.1397.079-.674 7.2552-.3156.3703-.7286.2793-.6071-.4614-.3218-.7468.3218-1.4753.3886-1.9246.3157-1.53.2853-1.9004.17-.6314-.0121-.0425-.1397.0182-1.4328 1.9672-2.1796 2.9446-1.7243 1.8456-.4128.164-.7164-.3704.0667-.6618.4008-.5889 2.386-3.0357 1.4389-1.882.929-1.0868-.0062-.1579h-.0546l-6.3385 4.1164-1.1293.1457-.4857-.4554.0608-.7467.2307-.2429 1.9064-1.3114Z"/></symbol>
    <symbol id="ic-copilot" viewBox="0 0 24 24"><path fill-rule="evenodd" fill="#0f172a" d="M23.922 16.997C23.061 18.492 18.063 22.02 12 22.02 5.937 22.02.939 18.492.078 16.997A.641.641 0 0 1 0 16.741v-2.869a.883.883 0 0 1 .053-.22c.372-.935 1.347-2.292 2.605-2.656.167-.429.414-1.055.644-1.517a10.098 10.098 0 0 1-.052-1.086c0-1.331.282-2.499 1.132-3.368.397-.406.89-.717 1.474-.952C7.255 2.937 9.248 1.98 11.978 1.98c2.731 0 4.767.957 6.166 2.093.584.235 1.077.546 1.474.952.85.869 1.132 2.037 1.132 3.368 0 .368-.014.733-.052 1.086.23.462.477 1.088.644 1.517 1.258.364 2.233 1.721 2.605 2.656a.841.841 0 0 1 .053.22v2.869a.641.641 0 0 1-.078.256Zm-11.75-5.992h-.344a4.359 4.359 0 0 1-.355.508c-.77.947-1.918 1.492-3.508 1.492-1.725 0-2.989-.359-3.782-1.259a2.137 2.137 0 0 1-.085-.104L4 11.746v6.585c1.435.779 4.514 2.179 8 2.179 3.486 0 6.565-1.4 8-2.179v-6.585l-.098-.104s-.033.045-.085.104c-.793.9-2.057 1.259-3.782 1.259-1.59 0-2.738-.545-3.508-1.492a4.359 4.359 0 0 1-.355-.508Zm2.328 3.25c.549 0 1 .451 1 1v2c0 .549-.451 1-1 1-.549 0-1-.451-1-1v-2c0-.549.451-1 1-1Zm-5 0c.549 0 1 .451 1 1v2c0 .549-.451 1-1 1-.549 0-1-.451-1-1v-2c0-.549.451-1 1-1Zm3.313-6.185c.136 1.057.403 1.913.878 2.497.442.544 1.134.938 2.344.938 1.573 0 2.292-.337 2.657-.751.384-.435.558-1.15.558-2.361 0-1.14-.243-1.847-.705-2.319-.477-.488-1.319-.862-2.824-1.025-1.487-.161-2.192.138-2.533.529-.269.307-.437.808-.438 1.578v.021c0 .265.021.562.063.893Zm-1.626 0c.042-.331.063-.628.063-.894v-.02c-.001-.77-.169-1.271-.438-1.578-.341-.391-1.046-.69-2.533-.529-1.505.163-2.347.537-2.824 1.025-.462.472-.705 1.179-.705 2.319 0 1.211.175 1.926.558 2.361.365.414 1.084.751 2.657.751 1.21 0 1.902-.394 2.344-.938.475-.584.742-1.44.878-2.497Z"/></symbol>
    <symbol id="ic-cursor" viewBox="0 0 24 24"><path fill-rule="evenodd" fill="#0f172a" d="M11.503.131 1.891 5.678a.84.84 0 0 0-.42.726v11.188c0 .3.162.575.42.724l9.609 5.55a1 1 0 0 0 .998 0l9.61-5.55a.84.84 0 0 0 .42-.724V6.404a.84.84 0 0 0-.42-.726L12.497.131a1.01 1.01 0 0 0-.996 0M2.657 6.338h18.55c.263 0 .43.287.297.515L12.23 22.918c-.062.107-.229.064-.229-.06V12.335a.59.59 0 0 0-.295-.51l-9.11-5.257c-.109-.063-.064-.23.061-.23"/></symbol>
    <symbol id="ic-antigravity" viewBox="0 0 24 24"><path fill-rule="evenodd" fill="#0f172a" d="M21.751 22.607c1.34 1.005 3.35.335 1.508-1.508C17.73 15.74 18.904 1 12.037 1 5.17 1 6.342 15.74.815 21.1c-2.01 2.009.167 2.511 1.507 1.506 5.192-3.517 4.857-9.714 9.715-9.714 4.857 0 4.522 6.197 9.714 9.715z"/></symbol>
  </defs>

  <rect width="1240" height="560" fill="#f8fafc"/>
  <rect width="1240" height="560" fill="url(#grid)"/>

  <text x="40" y="44" class="title">Delegate: the packet carries the work, config carries the routing</text>
  <text x="40" y="68" class="sub">Two paths run down this step and never meet. One row becomes one durable background job.</text>

  <!-- prompt path -->
  <text x="40" y="112" class="head" style="fill:#b45309">WHAT TO DO</text>
  <rect x="40" y="126" width="150" height="76" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="115" y="158" class="name" text-anchor="middle">one task row</text>
  <text x="115" y="180" class="small" text-anchor="middle">task · acceptance</text>

  <line x1="190" y1="164" x2="216" y2="164" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="220" y="126" width="220" height="76" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="330" y="158" class="name" text-anchor="middle">delegation packet</text>
  <text x="330" y="180" class="small" text-anchor="middle">the driver writes it, by hand</text>

  <line x1="440" y1="164" x2="466" y2="164" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="470" y="126" width="170" height="76" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="555" y="158" class="name m" text-anchor="middle">prompt.md</text>
  <text x="555" y="180" class="small" text-anchor="middle">copied once, kept as the ask</text>

  <!-- divider -->
  <line x1="40" y1="240" x2="660" y2="240" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6,5"/>
  <rect x="150" y="228" width="400" height="24" rx="12" fill="#f8fafc"/>
  <text x="350" y="245" class="tag" text-anchor="middle">the packet never names a backend, a model or an effort</text>

  <!-- config path -->
  <text x="40" y="298" class="head" style="fill:#4f46e5">WHERE IT RUNS</text>
  <rect x="40" y="312" width="150" height="76" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="115" y="344" class="name m" text-anchor="middle">--role</text>
  <text x="115" y="366" class="small" text-anchor="middle">the row's identity</text>

  <line x1="190" y1="350" x2="216" y2="350" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="220" y="312" width="220" height="76" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="330" y="344" class="name" text-anchor="middle">resolve from config</text>
  <text x="330" y="366" class="small" text-anchor="middle">and record where each value came from</text>

  <line x1="440" y1="350" x2="466" y2="350" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="470" y="312" width="170" height="76" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="555" y="344" class="name m" text-anchor="middle">run.sh flags</text>
  <text x="555" y="366" class="small" text-anchor="middle">backend · model · effort</text>

  <!-- refusals -->
  <rect x="40" y="428" width="600" height="96" rx="10" fill="#fff1f2" stroke="#fda4af"/>
  <text x="60" y="456" class="rose">refused before a job directory exists</text>
  <rect x="60" y="470" width="130" height="36" rx="18" fill="#ffffff" stroke="#fda4af"/>
  <text x="125" y="493" class="small" text-anchor="middle">no config at all</text>
  <rect x="200" y="470" width="150" height="36" rx="18" fill="#ffffff" stroke="#fda4af"/>
  <text x="275" y="493" class="small m" text-anchor="middle">--backend ≠ role</text>
  <rect x="360" y="470" width="140" height="36" rx="18" fill="#ffffff" stroke="#fda4af"/>
  <text x="430" y="493" class="small" text-anchor="middle">unsupported effort</text>
  <rect x="510" y="470" width="110" height="36" rx="18" fill="#ffffff" stroke="#fda4af"/>
  <text x="565" y="493" class="small m" text-anchor="middle">model = auto</text>

  <!-- merge into the job -->
  <path d="M 640 164 C 676 164, 676 216, 706 216" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 640 350 C 676 350, 676 298, 706 298" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="710" y="126" width="250" height="262" rx="10" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
  <text x="835" y="158" class="name m" text-anchor="middle">.handoff/jobs/&lt;jobId&gt;/</text>
  <text x="835" y="180" class="small" text-anchor="middle">durable state, readable later</text>
  <rect x="730" y="198" width="210" height="30" rx="6" fill="#f1f5f9"/>
  <text x="744" y="218" class="small m">prompt.md · run.sh · meta</text>
  <rect x="730" y="236" width="210" height="30" rx="6" fill="#f1f5f9"/>
  <text x="744" y="256" class="small m">log.jsonl · stderr.log</text>
  <rect x="730" y="274" width="210" height="30" rx="6" fill="#f1f5f9"/>
  <text x="744" y="294" class="small m">pid · exit_code · session_id</text>
  <text x="835" y="336" class="line" text-anchor="middle">nohup, detached,</text>
  <text x="835" y="356" class="line" text-anchor="middle">stdin closed</text>

  <line x1="960" y1="250" x2="996" y2="250" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- CLIs -->
  <text x="1100" y="112" class="head" style="fill:#64748b" text-anchor="middle">THE CONFIGURED BACKEND</text>
  <rect x="1000" y="130" width="200" height="46" rx="23" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <use href="#ic-codex" x="1020" y="143" width="20" height="20"/>
  <text x="1112" y="158" class="line m" style="fill:#334155" text-anchor="middle">codex exec</text>
  <rect x="1000" y="184" width="200" height="46" rx="23" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <use href="#ic-claude" x="1020" y="197" width="20" height="20"/>
  <text x="1112" y="212" class="line m" style="fill:#c2410c" text-anchor="middle">claude --print</text>
  <rect x="1000" y="238" width="200" height="46" rx="23" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <use href="#ic-copilot" x="1020" y="251" width="20" height="20"/>
  <text x="1112" y="266" class="line m" style="fill:#1d4ed8" text-anchor="middle">copilot -p</text>
  <rect x="1000" y="292" width="200" height="46" rx="23" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <use href="#ic-cursor" x="1020" y="305" width="20" height="20"/>
  <text x="1112" y="320" class="line m" style="fill:#15803d" text-anchor="middle">cursor-agent -p</text>
  <rect x="1000" y="346" width="200" height="46" rx="23" fill="#fdf4ff" stroke="#a21caf" stroke-width="1.5"/>
  <use href="#ic-antigravity" x="1020" y="359" width="20" height="20"/>
  <text x="1112" y="374" class="line m" style="fill:#a21caf" text-anchor="middle">agy -p</text>

  <rect x="710" y="428" width="490" height="96" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
  <text x="734" y="458" class="name">the jobId goes back into the row</text>
  <text x="734" y="484" class="line m">status = delegated</text>
  <text x="734" y="508" class="small">independent rows are submitted in parallel; a stale row is delegated twice</text>
  <path d="M 835 388 V 424" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
</svg>
