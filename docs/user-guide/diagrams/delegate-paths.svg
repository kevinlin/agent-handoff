<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 560">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0f172a; }
    .m { font-family: "SF Mono", Menlo, Consolas, ui-monospace, monospace; }
    .title { font-size: 22px; font-weight: 700; }
    .sub { font-size: 14px; fill: #64748b; }
    .name { font-size: 15px; font-weight: 700; }
    .line { font-size: 13px; fill: #475569; }
    .small { font-size: 12px; fill: #64748b; }
    .head { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; }
    .rose { font-size: 12px; font-weight: 600; fill: #be123c; }
    .tag { font-size: 12px; font-weight: 600; fill: #475569; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e6ebf2" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1240" height="560" fill="#f8fafc"/>
  <rect width="1240" height="560" fill="url(#grid)"/>

  <text x="40" y="44" class="title">Delegate: the packet carries the work, config carries the routing</text>
  <text x="40" y="68" class="sub">Two paths run down this step and never meet. One row becomes one durable background job.</text>

  <!-- prompt path -->
  <text x="40" y="112" class="head" fill="#b45309">WHAT TO DO</text>
  <rect x="40" y="126" width="150" height="76" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="115" y="158" class="name" text-anchor="middle">one task row</text>
  <text x="115" y="180" class="small" text-anchor="middle">task · acceptance</text>

  <line x1="190" y1="164" x2="216" y2="164" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="220" y="126" width="220" height="76" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="330" y="158" class="name" text-anchor="middle">delegation packet</text>
  <text x="330" y="180" class="small" text-anchor="middle">the driver writes it, by hand</text>

  <line x1="440" y1="164" x2="466" y2="164" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="470" y="126" width="170" height="76" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="555" y="158" class="name m" text-anchor="middle">prompt.md</text>
  <text x="555" y="180" class="small" text-anchor="middle">copied once, kept as the ask</text>

  <!-- divider -->
  <line x1="40" y1="240" x2="660" y2="240" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6,5"/>
  <rect x="150" y="228" width="400" height="24" rx="12" fill="#f8fafc"/>
  <text x="350" y="245" class="tag" text-anchor="middle">the packet never names a backend, a model or an effort</text>

  <!-- config path -->
  <text x="40" y="298" class="head" fill="#4f46e5">WHERE IT RUNS</text>
  <rect x="40" y="312" width="150" height="76" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="115" y="344" class="name m" text-anchor="middle">--role</text>
  <text x="115" y="366" class="small" text-anchor="middle">the row's identity</text>

  <line x1="190" y1="350" x2="216" y2="350" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="220" y="312" width="220" height="76" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="330" y="344" class="name" text-anchor="middle">resolve from config</text>
  <text x="330" y="366" class="small" text-anchor="middle">and record where each value came from</text>

  <line x1="440" y1="350" x2="466" y2="350" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="470" y="312" width="170" height="76" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="555" y="344" class="name m" text-anchor="middle">run.sh flags</text>
  <text x="555" y="366" class="small" text-anchor="middle">backend · model · effort</text>

  <!-- refusals -->
  <rect x="40" y="428" width="600" height="96" rx="10" fill="#fff1f2" stroke="#fda4af"/>
  <text x="60" y="456" class="rose">refused before a job directory exists</text>
  <rect x="60" y="470" width="130" height="36" rx="18" fill="#ffffff" stroke="#fda4af"/>
  <text x="125" y="493" class="small" text-anchor="middle">no config at all</text>
  <rect x="200" y="470" width="150" height="36" rx="18" fill="#ffffff" stroke="#fda4af"/>
  <text x="275" y="493" class="small m" text-anchor="middle">--backend ≠ role</text>
  <rect x="360" y="470" width="140" height="36" rx="18" fill="#ffffff" stroke="#fda4af"/>
  <text x="430" y="493" class="small" text-anchor="middle">unsupported effort</text>
  <rect x="510" y="470" width="110" height="36" rx="18" fill="#ffffff" stroke="#fda4af"/>
  <text x="565" y="493" class="small m" text-anchor="middle">model = auto</text>

  <!-- merge into the job -->
  <path d="M 640 164 C 676 164, 676 216, 706 216" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 640 350 C 676 350, 676 298, 706 298" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="710" y="126" width="250" height="262" rx="10" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
  <text x="835" y="158" class="name m" text-anchor="middle">.handoff/jobs/&lt;jobId&gt;/</text>
  <text x="835" y="180" class="small" text-anchor="middle">durable state, readable later</text>
  <rect x="730" y="198" width="210" height="30" rx="6" fill="#f1f5f9"/>
  <text x="744" y="218" class="small m">prompt.md · run.sh · meta</text>
  <rect x="730" y="236" width="210" height="30" rx="6" fill="#f1f5f9"/>
  <text x="744" y="256" class="small m">log.jsonl · stderr.log</text>
  <rect x="730" y="274" width="210" height="30" rx="6" fill="#f1f5f9"/>
  <text x="744" y="294" class="small m">pid · exit_code · session_id</text>
  <text x="835" y="336" class="line" text-anchor="middle">nohup, detached,</text>
  <text x="835" y="356" class="line" text-anchor="middle">stdin closed</text>

  <line x1="960" y1="250" x2="996" y2="250" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- CLIs -->
  <text x="1100" y="112" class="head" fill="#64748b" text-anchor="middle">THE CONFIGURED BACKEND</text>
  <rect x="1000" y="140" width="200" height="52" rx="26" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="1100" y="172" class="line m" fill="#334155" text-anchor="middle">codex exec</text>
  <rect x="1000" y="204" width="200" height="52" rx="26" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="1100" y="236" class="line m" fill="#c2410c" text-anchor="middle">claude --print</text>
  <rect x="1000" y="268" width="200" height="52" rx="26" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="1100" y="300" class="line m" fill="#1d4ed8" text-anchor="middle">copilot -p</text>

  <rect x="710" y="428" width="490" height="96" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
  <text x="734" y="458" class="name">the jobId goes back into the row</text>
  <text x="734" y="484" class="line m">status = delegated</text>
  <text x="734" y="508" class="small">independent rows are submitted in parallel; a stale row is delegated twice</text>
  <path d="M 835 388 V 424" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
</svg>
